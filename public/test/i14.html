<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #333;
        }

       .mobile-container {
            max-width: 480px;
            margin: auto;
            background-color: #555;
            min-height: 100vh;
            color: white;
        }

       .topnav {
            background-color: #333;
            position: relative;
        }

       .topnav #myLinks {
            display: none;
        }

       .topnav a {
            color: white;
            padding: 14px 16px;
            text-decoration: none;
            display: block;
        }

       .topnav a.icon {
            background: black;
            position: absolute;
            right: 0;
            top: 0;
        }

       .active {
            background-color: #4CAF50;
        }

       .movable-modal {
            display: none;
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            z-index: 1000;
            width: 300px;
            user-select: none;
        }

       .movable-modal-header {
            padding: 10px;
            cursor: move;
            background: #4CAF50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px 4px 0 0;
        }

       .movable-modal-content {
            padding: 15px;
        }

       .modal-close {
            cursor: pointer;
            font-size: 20px;
            padding: 0 5px;
        }

       .modal-close:hover {
            color: #ff4444;
        }

       .issue_toolbar {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            padding: 10px 0;
            margin: 10px 0;
            order: -1;
        }

       .issue_btn {
            padding: 5px 10px;
            background: #4CAF50;
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

       .issue_btn:hover {
            background: #45a049;
        }

        /* 新增高亮样式 */
       .issue_btn.active {
            background: #ff9800;
            border: 2px solid #ff5722;
        }

        /* 新增编辑窗口样式 */
       .edit-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            z-index: 1001;
            width: 300px;
            padding: 15px;
        }

       .edit-modal label {
            display: block;
            margin-bottom: 5px;
        }

       .edit-modal input,
       .edit-modal textarea {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
        }

       .edit-modal button {
            padding: 5px 10px;
            background: #4CAF50;
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
        }

       .edit-modal button:hover {
            background: #45a049;
        }

        /* 新增 blc 窗口样式 */
       .blc-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            z-index: 1002;
            width: 300px;
            padding: 15px;
        }

        /* 新增 appBtn 和 blcBtn 颜色样式 */
       .app-btn {
            background-color: #2196F3;
        }

       .app-btn:hover {
            background-color: #1976D2;
        }

       .blc-btn {
            background-color: #FF9800;
        }

       .blc-btn:hover {
            background-color: #F57C00;
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="topnav">
            <div id="id_4_info">
                <a href="#home" class="active" id="id_4_toggleUI" onclick="appCore.toggleUI();" style="border:1px brown solid;">i14 v1.113</a>
            </div>

            <div id="myLinks">
                <a href="https://littleflute.github.io/s177/" target="_blank">s177 Home</a>
                <a href="https://github.com/littleflute/s177" target="_blank">s177 Repo</a>
            </div>
            <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">
                <i class="fa fa-bars"></i>
            </a>
        </div>
    </div>

    <!-- 新增编辑窗口 -->
    <div id="edit-modal" class="edit-modal">
        <h2>Edit Issue</h2>
        <label for="edit-title">Title:</label>
        <input type="text" id="edit-title">
        <label for="edit-body">Body:</label>
        <textarea id="edit-body"></textarea>
        <button onclick="appCore.updateIssue()">Save Changes</button>
        <button onclick="appCore.closeEditModal()">Cancel</button>
    </div>

    <!-- 新增 blc 窗口 -->
    <div id="blc-window" class="blc-window">
        <h2>BLc Window</h2>
        <p>This is the blc window content.</p>
        <button onclick="appCore.closeBlcWindow()">Close</button>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('myLinks');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        class C4XDR177I14 {
            constructor() {
                this.currentRepo = 's177';
                this.currentIssue = 0;
                this.modal = null;
                this.isDragging = false;
                this.offsetX = 0;
                this.offsetY = 0;
                this.issuesLoaded = false;
                this.editModal = document.getElementById('edit-modal');
                this.blcWindow = document.getElementById('blc-window');
                this.#injectStyles();
            }

            #injectStyles() {
                const style = document.createElement('style');
                style.textContent = `
                   .movable-modal {
                        display: none;
                        position: fixed;
                        top: 100px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: #333;
                        color: white;
                        border: 1px solid #4CAF50;
                        border-radius: 5px;
                        z-index: 1000;
                        width: 300px;
                        user-select: none;
                    }
                   .movable-modal-header {
                        padding: 10px;
                        cursor: move;
                        background: #4CAF50;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        border-radius: 4px 4px 0 0;
                    }
                   .movable-modal-content {
                        padding: 15px;
                        display: flex;
                        flex-direction: column;
                    }
                   .modal-close {
                        cursor: pointer;
                        font-size: 20px;
                        padding: 0 5px;
                    }
                   .issue_toolbar {
                        display: flex;
                        overflow-x: auto;
                        gap: 5px;
                        padding: 10px 0;
                        margin: 10px 0;
                        order: -1;
                    }
                   .issue_btn {
                        padding: 5px 10px;
                        background: #4CAF50;
                        border: none;
                        border-radius: 3px;
                        color: white;
                        cursor: pointer;
                        white-space: nowrap;
                    }
                   .issue_btn:hover {
                        background: #45a049;
                    }
                   .issue_btn.active {
                        background: #ff9800;
                        border: 2px solid #ff5722;
                    }
                    /* 新增编辑窗口样式 */
                   .edit-modal {
                        display: none;
                        position: fixed;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        background: #333;
                        color: white;
                        border: 1px solid #4CAF50;
                        border-radius: 5px;
                        z-index: 1001;
                        width: 300px;
                        padding: 15px;
                    }
                   .edit-modal label {
                        display: block;
                        margin-bottom: 5px;
                    }
                   .edit-modal input,
                   .edit-modal textarea {
                        width: 100%;
                        padding: 5px;
                        margin-bottom: 10px;
                    }
                   .edit-modal button {
                        padding: 5px 10px;
                        background: #4CAF50;
                        border: none;
                        border-radius: 3px;
                        color: white;
                        cursor: pointer;
                    }
                   .edit-modal button:hover {
                        background: #45a049;
                    }
                    /* 新增 blc 窗口样式 */
                   .blc-window {
                        display: none;
                        position: fixed;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        background: #333;
                        color: white;
                        border: 1px solid #4CAF50;
                        border-radius: 5px;
                        z-index: 1002;
                        width: 300px;
                        padding: 15px;
                    }
                    /* 新增 appBtn 和 blcBtn 颜色样式 */
                   .app-btn {
                        background-color: #2196F3;
                    }
                   .app-btn:hover {
                        background-color: #1976D2;
                    }
                   .blc-btn {
                        background-color: #FF9800;
                    }
                   .blc-btn:hover {
                        background-color: #F57C00;
                    }
                `;
                document.head.appendChild(style);
            }

            #createModal() {
                if (this.modal) return;

                this.modal = document.createElement('div');
                this.modal.className = 'movable-modal';
                this.modal.innerHTML = `
                    <div class="movable-modal-header">
                        <span>Control Panel</span>
                        <span class="modal-close">×</span>
                    </div>
                    <div class="movable-modal-content">
                        <div id="issue_toolbar" class="issue_toolbar"></div>
                        <p>Current Repo: <span id="current-repo">${this.currentRepo}</span></p>
                        <div id="id_4_current_issue">
                            Current Issue: <span id="current_issue">${this.currentIssue}</span> 
                            <button id='id_4_edit_current_issue' onclick="appCore.openEditModal()">Edit Issue</button>
                            <div id="id_4_action_current_issue">
                            </div>
                            <div id="id_4_comments_current_issue">
                            </div>
                        </div>
                        <button onclick="appCore.toggleUI()">Close Window</button>
                    </div>
                `;

                document.body.appendChild(this.modal);

                const header = this.modal.querySelector('.movable-modal-header');
                const closeBtn = this.modal.querySelector('.modal-close');

                closeBtn.addEventListener('click', () => this.toggleUI());

                header.addEventListener('mousedown', (e) => {
                    this.startDrag(e.clientX, e.clientY);
                });

                header.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.startDrag(touch.clientX, touch.clientY);
                });
            }

            async getComments(divID, issueNumber) {
                try {
                    const container = document.getElementById(divID);
                    container.innerHTML = 'Loading comments...';

                    const comments = await this.#apiRequest('GET', `issues/${issueNumber}/comments`, null);
                    container.innerHTML = '';

                    if (comments.length === 0) {
                        container.innerHTML = '<div>No comments yet</div>';
                        return;
                    }

                    comments.forEach(comment => {
                        const btn = document.createElement('button');
                        btn.className = 'issue_btn';

                        const username = comment.user?.login || 'Anonymous';
                        const preview = comment.body
                           ? `${comment.body.substring(0, 30).replace(/\n/g, ' ')}...`
                            : 'No content';

                        btn.textContent = `${username}: ${preview}`;
                        btn.title = comment.body || '';
                        btn.onclick = () => window.open(comment.html_url, '_blank');

                        container.appendChild(btn);
                    });

                } catch (error) {
                    console.error('Failed to fetch comments:', error);
                    const container = document.getElementById(divID);
                    container.innerHTML = `<div style="color: #ff4444">Error loading comments: ${error.message}</div>`;
                }
            }

            async fetchAndDisplayIssues() {
                try {
                    const issues = await this.#apiRequest('GET', 'issues?per_page=100', null);
                    const toolbar = document.getElementById('issue_toolbar');
                    toolbar.innerHTML = '';

                    issues.forEach(issue => {
                        const btn = document.createElement('button');
                        btn.className = 'issue_btn';
                        btn.textContent = `#${issue.number}`;

                        // 初始化时设置高亮
                        if (issue.number === this.currentIssue) {
                            btn.classList.add('active');
                        }

                        btn.onclick = () => {
                            // 移除所有按钮的高亮
                            document.querySelectorAll('.issue_btn').forEach(b => b.classList.remove('active'));
                            // 添加当前按钮高亮
                            btn.classList.add('active');
                            this.currentIssue = issue.number;
                            document.getElementById('current_issue').textContent = this.currentIssue;
                            this.getComments('id_4_comments_current_issue', this.currentIssue);
                            this.updateActionButton(issue);
                        };
                        toolbar.appendChild(btn);
                    });

                    this.issuesLoaded = true;
                } catch (error) {
                    console.error('Failed to fetch issues:', error);
                }
            }

            startDrag(clientX, clientY) {
                this.isDragging = true;
                const rect = this.modal.getBoundingClientRect();
                this.offsetX = clientX - rect.left;
                this.offsetY = clientY - rect.top;

                const onMouseMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    this.modal.style.left = `${e.clientX - this.offsetX}px`;
                    this.modal.style.top = `${e.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onTouchMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.modal.style.left = `${touch.clientX - this.offsetX}px`;
                    this.modal.style.top = `${touch.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onMouseUp = () => {
                    this.isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                const onTouchEnd = () => {
                    this.isDragging = false;
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                document.addEventListener('touchmove', onTouchMove);
                document.addEventListener('touchend', onTouchEnd);
            }

            toggleUI() {
                this.#createModal();
                const isShowing = this.modal.style.display === 'block';
                this.modal.style.display = isShowing ? 'none' : 'block';

                if (!isShowing && !this.issuesLoaded) {
                    this.fetchAndDisplayIssues();
                }

                if (!isShowing && !this.modal.style.left) {
                    const rect = this.modal.getBoundingClientRect();
                    this.modal.style.left = `${window.innerWidth / 2 - rect.width / 2}px`;
                    this.modal.style.top = `${window.innerHeight / 2 - rect.height / 2}px`;
                }
            }

            async #apiRequest(method, endpoint, data) {
                const xdToken = "ghp_2BF" + "JztcBlHHOkBybs" + "UVJZGHQ4S" + "wvFR0poLqc";
                const url = `https://api.github.com/repos/littleflute/${this.currentRepo}/${endpoint}`;

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Authorization': `token ${xdToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: data ? JSON.stringify(data) : null
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            }

            openEditModal() {
                this.editModal.style.display = 'block';
                this.populateEditFields();
            }

            closeEditModal() {
                this.editModal.style.display = 'none';
            }

            async populateEditFields() {
                try {
                    const issue = await this.#apiRequest('GET', `issues/${this.currentIssue}`, null);
                    document.getElementById('edit-title').value = issue.title;
                    document.getElementById('edit-body').value = issue.body;
                } catch (error) {
                    console.error('Failed to fetch issue details:', error);
                }
            }

            async updateIssue() {
                const title = document.getElementById('edit-title').value;
                const body = document.getElementById('edit-body').value;
                const data = { title, body };

                try {
                    await this.#apiRequest('PATCH', `issues/${this.currentIssue}`, data);
                    alert('Issue updated successfully!');
                    this.closeEditModal();
                    this.fetchAndDisplayIssues();
                } catch (error) {
                    console.error('Failed to update issue:', error);
                    alert('Error updating issue: ' + error.message);
                }
            }

            updateActionButton(issue) {
                const actionDiv = document.getElementById('id_4_action_current_issue');
                actionDiv.innerHTML = '';

                if (issue.title.includes('blc:')) {
                    const blcBtn = document.createElement('button');
                    blcBtn.className = 'issue_btn blc-btn';
                    blcBtn.textContent = 'blc';
                    blcBtn.onclick = () => this.toggleBlcWindow();
                    actionDiv.appendChild(blcBtn);
                }
                if (issue.title.includes('app:')) {
                    const appBtn = document.createElement('button');
                    appBtn.className = 'issue_btn app-btn';
                    appBtn.textContent = 'app';
                    appBtn.onclick = async () => {
                        try {
                            const issue = await this.#apiRequest('GET', `issues/${this.currentIssue}`, null);
                            const jsCode = issue.body;

                            if (jsCode) {
                                try {
                                    // 使用 Function 构造函数执行代码
                                    const fn = new Function(jsCode);
                                    fn();
                                } catch (e) {
                                    alert('代码执行错误: ' + e.message);
                                }
                            } else {
                                alert('该 Issue 没有包含 JavaScript 代码');
                            }
                        } catch (error) {
                            console.error('获取 Issue 内容失败:', error);
                            alert('错误: ' + error.message);
                        }
                    };
                    actionDiv.appendChild(appBtn);
                }
            }

            toggleBlcWindow() {
                this.blcWindow.style.display = this.blcWindow.style.display === 'block' ? 'none' : 'block';
            }

            closeBlcWindow() {
                this.blcWindow.style.display = 'none';
            }
        }

        const appCore = new C4XDR177I14();
    </script>
</body>

</html>
