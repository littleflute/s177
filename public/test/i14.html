            // 新增背景色设置方法
            setCanvasColor(color) {
                this.backgroundColor = color;
                this.resizeCanvas();
                this.drawSample(); // 如果需要保留图形请保留这行
            }
            initializeCanvas() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');
                window.addEventListener('resize', () => this.resizeCanvas());
                this.resizeCanvas();
                
                // 初始绘制示例
                this.drawSample();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.ctx.fillStyle = this.backgroundColor;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            drawSample() {
                // 示例绘制代码
                this.ctx.fillStyle = '#4CAF50';
                this.ctx.beginPath();
                this.ctx.arc(this.canvas.width/2, this.canvas.height/2, 50, 0, Math.PI*2);
                this.ctx.fill();
            }

            #createModal() {
                if (this.modal) return;

                this.modal = document.createElement('div');
                this.modal.className = 'movable-modal';
                this.modal.innerHTML = `
                    <div class="movable-modal-header">
                        <span>Control Panel</span>
                        <span class="modal-close">×</span>
                    </div>
                    <div class="movable-modal-content">
                        <div id="issue_toolbar" class="issue_toolbar"></div>
                        <p>Current Repo: <span id="current-repo">${this.currentRepo}</span></p>
                        <div id="id_4_current_issue">
                            Current Issue: <span id="current_issue">${this.currentIssue}</span> 
                            <button id='id_4_edit_current_issue' onclick="appCore.openEditModal()">Edit Issue</button>
                            <div id="id_4_action_current_issue">
                            </div>
                            <div id="id_4_comments_current_issue">
                            </div>
                        </div>
                        <button onclick="appCore.openNewIssueModal()">New Issue</button>
                        <button onclick="appCore.openNewCommentModal()">New Comment</button>
                    </div>
                `;

                document.body.appendChild(this.modal);

                const header = this.modal.querySelector('.movable-modal-header');
                const closeBtn = this.modal.querySelector('.modal-close');

                closeBtn.addEventListener('click', () => this.toggleUI());

                header.addEventListener('mousedown', (e) => {
                    this.startDrag(e.clientX, e.clientY);
                });

                header.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.startDrag(touch.clientX, touch.clientY);
                });
            }

            openNewCommentModal() {
                document.getElementById('new-comment-body').value = '';
                this.newCommentModal.style.display = 'block';
            }

            closeNewCommentModal() {
                this.newCommentModal.style.display = 'none';
            }
            async saveNewComment() {
                const commentBody = document.getElementById('new-comment-body').value;
                if (!commentBody.trim()) {
                    alert('Comment content cannot be empty!');
                    return;
                }

                try {
                    await this.#apiRequest('POST', `issues/${this.currentIssue}/comments`, { body: commentBody });
                    alert('Comment created successfully!');
                    this.closeNewCommentModal();
                    this.getComments('id_4_comments_current_issue', this.currentIssue);
                } catch (error) {
                    console.error('Failed to create comment:', error);
                    alert('Error creating comment: ' + error.message);
                }
            }
            async getComments(divID, issueNumber) { 
                const container = document.getElementById(divID);
                container.innerHTML = 'Loading comments...';

                try {
                    const comments = await this.#apiRequest('GET', `issues/${issueNumber}/comments`, null);
                    container.innerHTML = '';

                    comments.forEach(comment => {
                        const commentDiv = document.createElement('div'); 
                        const toolbar = document.createElement('div');
                        toolbar.className = 'issue_toolbar';

                        const btns = ["show", "edit", "run"];
                        btns.forEach(btnText => {
                            const btn = document.createElement('button');
                            btn.className = 'issue_btn';
                            btn.textContent = btnText;

                            switch (btnText) {
                                case "show":
                                    btn.onclick = () => {
                                        alert(`Comment by ${comment.user.login}: ${comment.body}`);
                                    };
                                    break;
                                case "edit":
                                    btn.onclick = () => {
                                        this.openCommentEditModal(comment.id, comment.body);
                                    };
                                    break;
                                case "run":
                                    btn.onclick = () => {
                                        try {
                                            const fn = new Function(comment.body);
                                            fn();
                                        } catch (e) {
                                            alert('代码执行错误: ' + e.message);
                                        }
                                    };
                                    break;
                            }

                            toolbar.appendChild(btn);
                        });

                        commentDiv.appendChild(toolbar);
                        container.appendChild(commentDiv);
                    });
                } catch (error) {
                    console.error('Failed to fetch comments:', error);
                    container.innerHTML = 'Error loading comments.';
                }
            }

            async fetchAndDisplayIssues() {
                try {
                    const issues = await this.#apiRequest('GET', 'issues?per_page=100', null);
                    const toolbar = document.getElementById('issue_toolbar');
                    toolbar.innerHTML = '';

                    issues.forEach(issue => {
                        const btn = document.createElement('button');
                        btn.className = 'issue_btn';
                        btn.textContent = `#${issue.number}`;

                        // 初始化时设置高亮
                        if (issue.number === this.currentIssue) {
                            btn.classList.add('active');
                        }

                        btn.onclick = () => {
                            // 移除所有按钮的高亮
                            document.querySelectorAll('.issue_btn').forEach(b => b.classList.remove('active'));
                            // 添加当前按钮高亮
                            btn.classList.add('active');
                            this.currentIssue = issue.number;
                            document.getElementById('current_issue').textContent = this.currentIssue;
                            this.getComments('id_4_comments_current_issue', this.currentIssue);
                            this.updateActionButton(issue);
                        };
                        toolbar.appendChild(btn);
                    });

                    this.issuesLoaded = true;
                } catch (error) {
                    console.error('Failed to fetch issues:', error);
                }
            }

            startDrag(clientX, clientY) {
                this.isDragging = true;
                const rect = this.modal.getBoundingClientRect();
                this.offsetX = clientX - rect.left;
                this.offsetY = clientY - rect.top;

                const onMouseMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    this.modal.style.left = `${e.clientX - this.offsetX}px`;
                    this.modal.style.top = `${e.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onTouchMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.modal.style.left = `${touch.clientX - this.offsetX}px`;
                    this.modal.style.top = `${touch.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onMouseUp = () => {
                    this.isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                const onTouchEnd = () => {
                    this.isDragging = false;
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                document.addEventListener('touchmove', onTouchMove);

            async #apiRequest(method, endpoint, data) {

            updateActionButton(issue) {

                    appBtn.onclick = async () => {

                            alert('错误: ' + error.message);

                    };
                    actionDiv.appendChild(appBtn);

            async toggleBlcWindow() {
                const isShowing = this.blcWindow.style.display === 'block';
                this.blcWindow.style.display = isShowing ? 'none' : 'block';
                
                if (!isShowing) {
                    await this.parseBodyClass();
                }
            }
            async parseBodyClass() {
                try {
                    const issue = await this.#apiRequest('GET', `issues/${this.currentIssue}`, null);
                    const body = issue.body || '';
                    const className = this.extractClassName(body);
                    const classElement = document.getElementById('id_parse_body_as_class');
                    const memberFunctionsElement = document.getElementById('id_parse_member_functions');
                    
                    if (className) {
                        classElement.innerHTML = `解析到的类名: <strong>${className}</strong>`;
                    } else {
                        classElement.textContent = '在issue内容中未找到JavaScript类定义';
                    }

                    const memberFunctions = this.extractMemberFunctions(body);
                    if (memberFunctions.length > 0) {
                        memberFunctionsElement.innerHTML = '';
                        memberFunctions.forEach(func => {
                            const button = document.createElement('button');
                            button.className = 'issue_btn';
                            button.textContent = func;
                            button.onclick = () => {
                                try {
                                    const jsCode = `(() => { ${body} const instance = new ${className}(); instance.${func}(); })()`;
                                    const fn = new Function(jsCode);
                                    fn();
                                } catch (e) {
                                    alert(`执行函数 ${func} 时出错: ${e.message}`);
                                }
                            };
                            const li = document.createElement('li');
                            li.appendChild(button);
                            memberFunctionsElement.appendChild(li);
                        });
                    } else {
                        memberFunctionsElement.innerHTML = '<li>未找到成员函数</li>';
                    }
                } catch (error) {
                    console.error('解析类名和成员函数失败:', error);
                    document.getElementById('id_parse_body_as_class').textContent = 
                        '解析错误: ' + error.message;
                    document.getElementById('id_parse_member_functions').innerHTML = '';
                }
            }
            
            extractClassName(body) {
                // 改进后的正则表达式，支持更多格式
                const classRegex = /(?:^|\s)(?:export\s+)?class\s+([A-Za-z_$][A-Za-z0-9_$]*)/m;
                const match = body.match(classRegex);
                return match ? match[1] : null;
            }

            extractMemberFunctions(body) {
                const funcRegex = /(?:^|\s)(?:async\s+)?(?:static\s+)?([A-Za-z_$][A-Za-z0-9_$]*)\s*\([^)]*\)\s*{/gm;
                const matches = [];
                let match;
                while ((match = funcRegex.exec(body))!== null) {
                    matches.push(match[1]);
                }
                return matches;
            }

                }
            }
