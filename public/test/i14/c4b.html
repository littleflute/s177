<!--
做一个网页模拟三维数字魔方。在画布上实现,用three.js
特性：

完整实现的3D数字魔方，每个面颜色不同，都有独立编号,（11-19,21-29...),编号显示在面上


专业级光照效果（环境光+方向光）

优化的材质系统（Phong材质）

增强的轴指示系统（带标签的3D坐标轴）

流畅的动画控制系统（支持暂停/继续）

自然的手动旋转交互

响应式布局支持

智能数字标签定位系统

抗锯齿渲染

优化的性能表现

使用方法：

初始状态魔方静止

点击按钮启动/暂停自动旋转

在暂停状态下可用鼠标拖拽旋转

窗口自动适应屏幕尺寸

数字标签自动面向观察者方向

包含完整的3D坐标轴指示,坐标轴箭头处显示X,Y,Z字样，旋转时坐标轴也旋转
-->
<!DOCTYPE html>
<html>
<head>
    <title>3D数字魔方</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="toggle">启动/暂停旋转</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let autoRotate = false;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const labels = [];
        
        // 初始化场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建魔方容器组
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        // 设置相机位置
        camera.position.z = 8;

        // 创建光照系统
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 创建坐标轴
        function createAxis() {
            const axes = [];
            // X轴
            const xAxis = new THREE.ArrowHelper(
                new THREE.Vector3(1, 0, 0), 
                new THREE.Vector3(0, 0, 0), 
                3, 0xff0000, 0.3, 0.2
            );
            axes.push(xAxis);
            
            // Y轴
            const yAxis = new THREE.ArrowHelper(
                new THREE.Vector3(0, 1, 0), 
                new THREE.Vector3(0, 0, 0), 
                3, 0x00ff00, 0.3, 0.2
            );
            axes.push(yAxis);
            
            // Z轴
            const zAxis = new THREE.ArrowHelper(
                new THREE.Vector3(0, 0, 1), 
                new THREE.Vector3(0, 0, 0), 
                3, 0x0000ff, 0.3, 0.2
            );
            axes.push(zAxis);

            // 坐标轴标签
            const createAxisLabel = (text, color, position) => {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 64;
                canvas.height = 64;
                context.font = '24px Arial';
                context.fillStyle = color;
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(text, 32, 32);
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(0.5, 0.5, 1);
                sprite.position.copy(position);
                return sprite;
            };

            axes.push(createAxisLabel('X', 0xff0000, new THREE.Vector3(3.5, 0, 0)));
            axes.push(createAxisLabel('Y', 0x00ff00, new THREE.Vector3(0, 3.5, 0)));
            axes.push(createAxisLabel('Z', 0x0000ff, new THREE.Vector3(0, 0, 3.5)));
            
            axes.forEach(axis => cubeGroup.add(axis));
        }
        createAxis();

        // 创建数字纹理
        function createNumberTexture(number, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256;
            context.fillStyle = `hsl(${color * 60}, 80%, 50%)`;
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = '100px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = 'white';
            context.fillText(number, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        // 创建魔方面
        const faceConfigs = [
            { dir: new THREE.Vector3(0, 0, 1), color: 0, start: 11 },  // 前面
            { dir: new THREE.Vector3(0, 0, -1), color: 1, start: 41 }, // 后面
            { dir: new THREE.Vector3(1, 0, 0), color: 2, start: 21 },  // 右面
            { dir: new THREE.Vector3(-1, 0, 0), color: 3, start: 61 }, // 左面
            { dir: new THREE.Vector3(0, 1, 0), color: 4, start: 31 },  // 顶面
            { dir: new THREE.Vector3(0, -1, 0), color: 5, start: 51 }  // 底面
        ];

        faceConfigs.forEach(config => {
            for(let x = -1; x <= 1; x++) {
                for(let y = -1; y <= 1; y++) {
                    const pos = new THREE.Vector3();
                    const number = config.start + 
                        (config.dir.z !== 0 ? (1 - y) * 3 + (x + 1) :
                        config.dir.x !== 0 ? (1 - y) * 3 + (1 - z) :
                        (x + 1) * 3 + (1 - z));
                    
                    // 创建面片
                    const geometry = new THREE.PlaneGeometry(0.95, 0.95);
                    const material = new THREE.MeshPhongMaterial({
                        color: `hsl(${config.color * 60}, 80%, 50%)`,
                        shininess: 100
                    });
                    const plane = new THREE.Mesh(geometry, material);
                    
                    // 计算位置和朝向
                    pos.add(config.dir).add(
                        new THREE.Vector3(
                            config.dir.y || config.dir.z ? x : 0,
                            config.dir.x || config.dir.z ? y : 0,
                            config.dir.x || config.dir.y ? y : 0
                        )
                    );
                    plane.position.copy(pos);
                    plane.lookAt(pos.clone().add(config.dir));
                    cubeGroup.add(plane);

                    // 创建数字标签
                    const labelGeometry = new THREE.PlaneGeometry(0.6, 0.6);
                    const labelMaterial = new THREE.MeshBasicMaterial({
                        map: createNumberTexture(number, config.color),
                        transparent: true
                    });
                    const label = new THREE.Mesh(labelGeometry, labelMaterial);
                    label.position.copy(pos).add(config.dir.clone().multiplyScalar(0.01));
                    labels.push(label);
                    cubeGroup.add(label);
                }
            }
        });

        // 事件监听
        document.getElementById('toggle').addEventListener('click', () => {
            autoRotate = !autoRotate;
        });

        renderer.domElement.addEventListener('mousedown', e => {
            if(!autoRotate) {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mousemove', e => {
            if(isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                cubeGroup.rotation.y += deltaX * 0.01;
                cubeGroup.rotation.x += deltaY * 0.01;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // 窗口resize处理
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新数字标签方向
            labels.forEach(label => {
                label.quaternion.copy(camera.quaternion);
            });

            // 自动旋转
            if(autoRotate) {
                cubeGroup.rotation.x += 0.005;
                cubeGroup.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
