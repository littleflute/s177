做一个网页模拟三维数字魔方。在画布上实现,用three.js
特性：

完整实现的3D数字魔方，每个面颜色不同，都有独立编号,（11-19,21-29...),编号显示在面上
前后面（Z轴方向）：使用标准坐标计算

前面：11,12,13...19

右面：21,22,23...29

顶面：31,32,33...39

后面：41,42,43...49

底面：51,52,53...59

左面：61,62,63...69

专业级光照效果（环境光+方向光）

优化的材质系统（Phong材质）

增强的轴指示系统（带标签的3D坐标轴）

流畅的动画控制系统（支持暂停/继续）

自然的手动旋转交互

响应式布局支持

智能数字标签定位系统

抗锯齿渲染

优化的性能表现

使用方法：

初始状态魔方静止

点击按钮启动/暂停自动旋转

在暂停状态下可用鼠标拖拽旋转

窗口自动适应屏幕尺寸

数字标签自动面向观察者方向

包含完整的3D坐标轴指示,坐标轴箭头处显示X,Y,Z字样，旋转时坐标轴也旋转
