            width: 12px;

            background: #00ff00;

        }

    <script>
        function toggleMenu() {
            const menu = document.getElementById('myLinks');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        class C4XDR177I14 {
            constructor() {
                this.isTouchDevice = 'ontouchstart' in window;
                this.controlPointSize = this.isTouchDevice ? 20 : 12;
                this.adjustingControl = null;
                
                this.selectedShapeIndex = -1;
                this.isDragging = false;
                this.dragStartX = 0;
                this.dragStartY = 0;
                this.triangleSizes = [30, 50, 70]; // 三角形尺寸选项
                this.drawHistory = [];
                
                this.drawType = null; // 'circle' 或 'rect'
                this.lastDrawTime = 0;
                this.drawColor = '#FF5722'; // 默认绘图颜色
                this.backgroundColor = '#333'; // 初始化背景色
                this.initializeCanvas();
                this.#initCanvasEvents(); // 新增：初始化画布事件监听
                this.currentRepo = 's177';
                this.currentIssue = 0;
                this.modal = null;
                this.isDragging = false;
                this.offsetX = 0;
                this.offsetY = 0;
                this.issuesLoaded = false;
                this.editModal = document.getElementById('edit-modal');
                this.blcWindow = document.getElementById('blc_window');
                this.commentEditModal = document.getElementById('comment-edit-modal');
                this.newIssueModal = document.getElementById('new-issue-modal');
                this.newCommentModal = document.getElementById('new-comment-modal');
                this.currentCommentId = null;
                this.#injectStyles();
            }
            #initCanvasEvents() {
                const getCanvasCoordinates = (event) => {
                    const rect = this.canvas.getBoundingClientRect();
                    let clientX, clientY;
                    
                    if (event.touches) {
                        const touch = event.touches[0];
                        clientX = touch.clientX;
                        clientY = touch.clientY;
                    } else {
                        clientX = event.clientX;
                        clientY = event.clientY;
                    }

                    return {
                        x: clientX - rect.left,
                        y: clientY - rect.top
                    };
                };

                // 桌面端事件
                this.canvas.addEventListener('mousedown', (e) => {
                    const pos = getCanvasCoordinates(e);
                    this.handleCanvasMouseDown(pos);
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    const pos = getCanvasCoordinates(e);
                    this.handleCanvasMouseMove(pos);
                });

                this.canvas.addEventListener('mouseup', () => this.handleCanvasMouseUp());
                this.canvas.addEventListener('mouseleave', () => this.handleCanvasMouseUp());

                // 移动端事件
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const pos = getCanvasCoordinates(e);
                    this.handleCanvasMouseDown(pos);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const pos = getCanvasCoordinates(e);
                    this.handleCanvasMouseMove(pos);
                });

                this.canvas.addEventListener('touchend', () => this.handleCanvasMouseUp());
            }
            handleCanvasMouseDown(pos) {
                if (this.isTouchDevice) {
                    pos.x -= this.controlPointSize/2;
                    pos.y -= this.controlPointSize/2;
                }
                
                const index = this.getShapeAtPosition(pos.x, pos.y);
                if (index !== -1) {
                    this.selectedShapeIndex = index;
                    const shape = this.drawHistory[index];

                    // 检查是否点击了控制点
                    const control = this.getControlPointAt(pos.x, pos.y, shape);
                    if (control) {
                        this.adjustingControl = control;
                        this.isDragging = true;
                        this.dragStartX = pos.x;
                        this.dragStartY = pos.y;
                        this.redrawCanvas(); // 新增：立即重绘画布
                        return;
                    }

                    this.isDragging = true;
                    this.dragStartX = pos.x;
                    this.dragStartY = pos.y;
                    
                    // 将选中的图形移到最上层
                    const selected = this.drawHistory.splice(index, 1)[0];
                    this.drawHistory.push(selected);
                    this.selectedShapeIndex = this.drawHistory.length - 1;
                    this.redrawCanvas(); // 新增：立即重绘画布
                } else if (this.drawType) {
                    this.handleCanvasClick(pos);
                }
            }

            getControlPointAt(x, y, shape) {
                const controlSize = this.controlPointSize;
                switch(shape.type) {
                    case 'circle':
                        const controlX = shape.x + shape.radius;
                        const controlY = shape.y;
                        if (Math.hypot(x - controlX, y - controlY) < controlSize) return 'radius';
                        break;
                    case 'rect':
                        const rectControlX = shape.x + shape.width;
                        const rectControlY = shape.y + shape.height;
                        if (Math.abs(x - rectControlX) < controlSize && 
                           Math.abs(y - rectControlY) < controlSize) return 'size';
                        break;
                    case 'triangle':
                        for (let i = 0; i < shape.points.length; i++) {
                            const point = shape.points[i];
                            if (Math.hypot(x - point.x, y - point.y) < controlSize) return `point${i}`;
                        }
                        break;
                }
                return null;
            }

            handleCanvasMouseMove(pos) {
                if (!this.isDragging) return;

                const currentX = pos.x;
                const currentY = pos.y;
                const deltaX = currentX - this.dragStartX;
                const deltaY = currentY - this.dragStartY;

                if (this.adjustingControl) {
                    // 调整控制点
                    const shape = this.drawHistory[this.selectedShapeIndex];
                    
                    switch (shape.type) {
                        case 'circle':
                            if (this.adjustingControl === 'radius') {
                                shape.radius = Math.max(10, shape.radius + deltaX);
                            }
                            break;
                            
                        case 'rect':
                            if (this.adjustingControl === 'size') {
                                shape.width = Math.max(10, shape.width + deltaX);
                                shape.height = Math.max(10, shape.height + deltaY);
                            }
                            break;
                            
                        case 'triangle':
                            const pointIndex = parseInt(this.adjustingControl.replace('point', ''));
                            shape.points[pointIndex].x += deltaX;
                            shape.points[pointIndex].y += deltaY;
                            break;
                    }
                    
                    this.dragStartX = currentX;
                    this.dragStartY = currentY;
                    this.redrawCanvas();
                } else if (this.selectedShapeIndex !== -1) {
                    // 移动整个图形
                    const shape = this.drawHistory[this.selectedShapeIndex];
                    
                    switch (shape.type) {
                        case 'circle':
                        case 'rect':
                            shape.x += deltaX;
                            shape.y += deltaY;
                            break;
                            
                        case 'triangle':
                            shape.points.forEach(point => {
                                point.x += deltaX;
                                point.y += deltaY;
                            });
                            break;
                    }
                    
                    this.dragStartX = currentX;
                    this.dragStartY = currentY;
                    this.redrawCanvas();
                }
            }

            handleCanvasMouseUp() {
                this.isDragging = false;
                this.adjustingControl = null;
                this.selectedShapeIndex = -1;
                this.redrawCanvas();
            }
            getShapeAtPosition(x, y) {
                for (let i = this.drawHistory.length - 1; i >= 0; i--) {
                    const shape = this.drawHistory[i];
                    let isInside = false;
                    
                    switch(shape.type) {
                        case 'circle':
                            const dx = x - shape.x;
                            const dy = y - shape.y;
                            isInside = (dx * dx + dy * dy) <= shape.radius * shape.radius;
                            break;
                        case 'rect':
                            isInside = x >= shape.x && x <= shape.x + shape.width &&
                                       y >= shape.y && y <= shape.y + shape.height;
                            break;
                        case 'triangle':
                            isInside = this.isPointInTriangle(x, y, shape.points);
                            break;
                    }
                    
                    if (isInside) return i;
                }
                return -1;
            }
            isPointInTriangle(x, y, points) {
                const p0 = points[0], p1 = points[1], p2 = points[2];
                const area = 0.5 * (-p1.y * p2.x + p0.y * (-p1.x + p2.x) + 
                            p0.x * (p1.y - p2.y) + p1.x * p2.y);
                
                const s = 1 / (2 * area) * (p0.y * p2.x - p0.x * p2.y + 
                            (p2.y - p0.y) * x + (p0.x - p2.x) * y);
                const t = 1 / (2 * area) * (p0.x * p1.y - p0.y * p1.x + 
                            (p0.y - p1.y) * x + (p1.x - p0.x) * y);
                
                return s > 0 && t > 0 && (1 - s - t) > 0;
            }

            redrawCanvas() {
                this.ctx.fillStyle = this.backgroundColor ;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.drawHistory.forEach((shape, index) => {
                    // 修改：始终显示选中状态，不依赖拖动状态
                    this.ctx.globalAlpha = index === this.selectedShapeIndex ? 0.7 : 1.0; 

                    this.ctx.fillStyle = shape.color;
                    
                    // 绘制图形
                    switch(shape.type) {
                        case 'circle':
                            this.ctx.beginPath();
                            this.ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                            this.ctx.fill();
                            break;
                        case 'rect':
                            this.ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
                            break;
                        case 'triangle':
                            this.ctx.beginPath();
                            this.ctx.moveTo(shape.points[0].x, shape.points[0].y);
                            shape.points.forEach(p => this.ctx.lineTo(p.x, p.y));
                            this.ctx.closePath();
                            this.ctx.fill();
                            break;
                    }

                    // 绘制选中高亮
                    if (index === this.selectedShapeIndex) {
                        const controlSize = this.controlPointSize;
                        const halfSize = controlSize / 2;
                        
                        this.ctx.fillStyle = '#00ff00';
                        this.ctx.strokeStyle = '#ffffff';
                        this.ctx.lineWidth = 2;

                        switch(shape.type) {
                            case 'circle':
                                const controlX = shape.x + shape.radius;
                                this.ctx.beginPath();
                                this.ctx.arc(controlX, shape.y, halfSize, 0, Math.PI*2);
                                this.ctx.fill();
                                this.ctx.stroke();
                                break;
                            case 'rect':
                                this.ctx.fillRect(
                                    shape.x + shape.width - halfSize,
                                    shape.y + shape.height - halfSize,
                                    controlSize,
                                    controlSize
                                );
                                break;
                            case 'triangle':
                                shape.points.forEach(point => {
                                    this.ctx.beginPath();
                                    this.ctx.arc(point.x, point.y, halfSize, 0, Math.PI*2);
                                    this.ctx.fill();
                                    this.ctx.stroke();
                                });
                                break;
                        }
                    }
                });

                // 添加网格背景
                this.ctx.globalAlpha = 0.2;
                this.ctx.strokeStyle = '#ffffff';
                this.ctx.lineWidth = 0.5;
                const gridSize = 20;
                for (let x = 0; x < this.canvas.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let y = 0; y < this.canvas.height; y += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
                this.ctx.globalAlpha = 1.0;

                
            }


            setDrawType(type) {
                this.drawType = type;
                this.showDrawCursor();
                // 同步按钮状态
                const activeBtn = [...document.querySelectorAll('.draw-btn')]
                    .find(btn => btn.dataset.drawType === type);
                if (activeBtn) this.#updateButtonStates(activeBtn);
            }

            // 显示绘图光标提示
            showDrawCursor() {
                this.canvas.style.cursor = 'crosshair';
                setTimeout(() => {
                    this.canvas.style.cursor = 'default';
                }, 2000);
            }
            // 处理画布点击事件
            handleCanvasClick(pos) {
                if (!this.drawType) return;

                const now = Date.now();
                if (now - this.lastDrawTime < 300) return;
                this.lastDrawTime = now;

                switch(this.drawType) {
                    case 'circle':
                        this.drawRandomCircle(pos.x, pos.y);
                        break;
                    case 'rect':
                        // 修复矩形中心点坐标计算
                        this.drawRandomRect(pos.x, pos.y);
                        break;
                    case 'triangle':
                        this.drawRandomTriangle(pos.x, pos.y);
                        break;
                }
                this.redrawCanvas(); // 新增：绘制后刷新画布
            }
            drawRandomTriangle(x, y) {
                const color = this.getRandomColor();
                const size = this.triangleSizes[Math.floor(Math.random() * this.triangleSizes.length)];
                
                // 生成等边三角形顶点坐标
                const height = size * Math.sqrt(3)/2;
                const points = [
                    {x: x, y: y - height/2},        // 顶点
                    {x: x - size/2, y: y + height/2}, // 左下角
                    {x: x + size/2, y: y + height/2}  // 右下角
                ];

                this.drawHistory.push({
                    type: 'triangle',
                    points,
                    color
                });

                this.ctx.fillStyle = color;
                this.ctx.beginPath();
                this.ctx.moveTo(points[0].x, points[0].y);
                points.forEach(point => this.ctx.lineTo(point.x, point.y));
                this.ctx.closePath();
                this.ctx.fill();
            }
            // 绘制随机圆形
            drawRandomCircle(x, y) {
                const color = this.getRandomColor();
                const radius = Math.random() * 50 + 20;
                
                // 存储绘图信息
                this.drawHistory.push({
                    type: 'circle',
                    x,
                    y,
                    radius,
                    color
                });

                this.ctx.fillStyle = color;
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                this.ctx.fill();
            }
            // 绘制随机矩形
            drawRandomRect(x, y) {
                const color = this.getRandomColor();
                const width = Math.random() * 100 + 50;
                const height = Math.random() * 100 + 50;
                
                this.drawHistory.push({
                    type: 'rect',
                    x: x - width/2,  // 存储基于中心的坐标
                    y: y - height/2,
                    width,
                    height,
                    color
                });
            }
            getRandomColor() {
                return `hsl(${Math.random() * 360}, 70%, 60%)`;
            }

            // 新增背景色设置方法
            setCanvasColor(color) {
                this.backgroundColor = color; 
                this.redrawCanvas(); // 直接调用重绘
            }

                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.redrawCanvas();
            }
            redrawHistory() {
                this.drawHistory.forEach(shape => {
                    this.ctx.fillStyle = shape.color;
                    if (shape.type === 'circle') {
                        this.ctx.beginPath();
                        this.ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                    } else if (shape.type === 'rect') {
                        // 修复矩形重绘坐标问题
                        this.ctx.fillRect(
                            shape.x,  // 直接使用存储的左上角X坐标
                            shape.y,  // 直接使用存储的左上角Y坐标
                            shape.width,
                            shape.height
                        );
                    }else if (shape.type === 'triangle') {
                        this.ctx.beginPath();
                        this.ctx.moveTo(shape.points[0].x, shape.points[0].y);
                        shape.points.forEach(point => this.ctx.lineTo(point.x, point.y));
                        this.ctx.closePath();
                        this.ctx.fill();
                    }
                });
            }

                // 示例绘制代码
                this.ctx.fillStyle = '#4CAF50';

                this.ctx.fill();
            }

            startDrag(clientX, clientY) {
                this.isDragging = true;
                const rect = this.modal.getBoundingClientRect();
                this.offsetX = clientX - rect.left;
                this.offsetY = clientY - rect.top;

                const onMouseMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    this.modal.style.left = `${e.clientX - this.offsetX}px`;
                    this.modal.style.top = `${e.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onTouchMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.modal.style.left = `${touch.clientX - this.offsetX}px`;
                    this.modal.style.top = `${touch.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onMouseUp = () => {
                    this.isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                const onTouchEnd = () => {
                    this.isDragging = false;
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                document.addEventListener('touchmove', onTouchMove);
                document.addEventListener('touchend', onTouchEnd);
            }

            async parseBodyClass() {
                try {
                    const issue = await this.#apiRequest('GET', `issues/${this.currentIssue}`, null);
                    const body = issue.body || '';
                    const className = this.extractClassName(body);
                    const classElement = document.getElementById('id_parse_body_as_class');
                    const memberFunctionsElement = document.getElementById('id_parse_member_functions');
                    
                    if (className) {
                        classElement.innerHTML = `解析到的类名: <strong>${className}</strong>`;
                    } else {
                        classElement.textContent = '在issue内容中未找到JavaScript类定义';
                    }

                    const memberFunctions = this.extractMemberFunctions(body);
                    if (memberFunctions.length > 0) {
                        memberFunctionsElement.innerHTML = '';
                        memberFunctions.forEach(func => {
                            const button = document.createElement('button');
                            button.className = 'issue_btn';
                            button.textContent = func;
                            button.onclick = () => {
                                try {
                                    const jsCode = `(() => { ${body} const instance = new ${className}(); instance.${func}(); })()`;
                                    const fn = new Function(jsCode);
                                    fn();
                                } catch (e) {
                                    alert(`执行函数 ${func} 时出错: ${e.message}`);
                                }
                            };
                            const li = document.createElement('li');
                            li.appendChild(button);
                            memberFunctionsElement.appendChild(li);
                        });
                    } else {
                        memberFunctionsElement.innerHTML = '<li>未找到成员函数</li>';
                    }
                } catch (error) {
                    console.error('解析类名和成员函数失败:', error);
                    document.getElementById('id_parse_body_as_class').textContent = 
                        '解析错误: ' + error.message;
                    document.getElementById('id_parse_member_functions').innerHTML = '';
                }
            }
            
            extractClassName(body) {
                // 改进后的正则表达式，支持更多格式
                const classRegex = /(?:^|\s)(?:export\s+)?class\s+([A-Za-z_$][A-Za-z0-9_$]*)/m;
                const match = body.match(classRegex);
                return match ? match[1] : null;
            }

            extractMemberFunctions(body) {
                const funcRegex = /(?:^|\s)(?:async\s+)?(?:static\s+)?([A-Za-z_$][A-Za-z0-9_$]*)\s*\([^)]*\)\s*{/gm;
                const matches = [];
                let match;
                while ((match = funcRegex.exec(body))!== null) {
                    matches.push(match[1]);
                }
                return matches;
            }

            }

            openCommentEditModal(commentId, commentBody) {
                this.currentCommentId = commentId;
                document.getElementById('comment-edit-body').value = commentBody;
                this.commentEditModal.style.display = 'block';
            }

            closeCommentEditModal() {
                this.commentEditModal.style.display = 'none';
            }

            async saveCommentEdit() {
                const newCommentBody = document.getElementById('comment-edit-body').value;
                try {
                    await this.#apiRequest('PATCH', `issues/comments/${this.currentCommentId}`, { body: newCommentBody });
                    alert('Comment updated successfully!');
                    this.closeCommentEditModal();
                    this.getComments('id_4_comments_current_issue', this.currentIssue);
                } catch (error) {
                    console.error('Failed to update comment:', error);
                    alert('Error updating comment: ' + error.message);
                }
            }

            openNewIssueModal() {
                this.newIssueModal.style.display = 'block';
            }

            closeNewIssueModal() {
                this.newIssueModal.style.display = 'none';
            }

            runJS(idTa){
                const js = document.getElementById(idTa).value;
                try {
                    const fn = new Function(js);
                    fn();
                } catch (e) {
                    alert('代码执行错误: ' + e.message);
                }
            }

            async createNewIssue() {
                const title = document.getElementById('new-issue-title').value;
                const body = document.getElementById('id_new_issue_body').value;
                const data = { title, body };

                try {
                    await this.#apiRequest('POST', 'issues', data);
                    alert('New issue created successfully!');
                    this.closeNewIssueModal();
                    this.fetchAndDisplayIssues();
                } catch (error) {
                    console.error('Failed to create new issue:', error);
                    alert('Error creating new issue: ' + error.message);
                }
            }
        }

        const appCore = new C4XDR177I14();
    </script>
</body>
