<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #scene-container { position: absolute; width: 100%; height: 100%; }
        #toolbar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(0,0,0,0.7); padding: 10px; text-align: center;
        }
        button {
            padding: 10px 20px; margin: 5px;
            font-size: 16px; cursor: pointer;
        }
        #dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            display: none;
        }
        #dialog-header {
            cursor: move;
            background-color: #f0f0f0;
            padding: 10px;
            margin: -20px -20px 20px -20px;
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <div id="toolbar">
        <button id="toggle-button">停止转动</button>
        <button id="rotate-front">旋转前面</button>
        <button id="rotate-middle">旋转中间层</button>
        <button id="rotate-back">旋转后面</button>
        <button id="open-dialog">打开对话框</button>
    </div>
    <div id="dialog">
        <div id="dialog-header">拖动我</div>
        <p>这是一个可移动的对话框。</p>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('scene-container').appendChild(renderer.domElement);

        // 灯光设置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 魔方参数
        const CUBE_SIZE = 1;
        const GAP = 0.1;
        const SPACING = CUBE_SIZE + GAP;
        const layers = [];
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xffa500, 0xffffff];

        // 创建3个层组（前、中、后）
        for(let z = -1; z <= 1; z++) {
            const layerGroup = new THREE.Group();
            layerGroup.position.z = z * SPACING;
            scene.add(layerGroup);
            layers[z+1] = layerGroup;

            // 填充每个层的立方体
            for(let x = -1; x <= 1; x++) {
                for(let y = -1; y <= 1; y++) {
                    const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
                    const materials = colors.map(color => new THREE.MeshPhongMaterial({ color }));
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(x*SPACING, y*SPACING, 0);
                    layerGroup.add(cube);
                }
            }
        }

        camera.position.z = 8;
        let isRotating = true;

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            if(isRotating) {
                scene.rotation.x += 0.005;
                scene.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();

        // 控制按钮
        document.getElementById('toggle-button').addEventListener('click', function() {
            isRotating = !isRotating;
            this.textContent = isRotating ? '停止转动' : '开始转动';
        });

        // 层旋转函数（改进版）
        function rotateLayer(layerGroup, axis = 'z', angle = Math.PI/2) {
            if(layerGroup.rotating) return;
            layerGroup.rotating = true;
            
            const start = performance.now();
            const duration = 500;
            const startRotation = layerGroup.rotation[axis];
            
            function update() {
                const elapsed = performance.now() - start;
                const progress = Math.min(elapsed/duration, 1);
                layerGroup.rotation[axis] = startRotation + angle*progress;
                
                if(progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    // 计算旋转后的新位置
                    const rotationMatrix = new THREE.Matrix4().makeRotationAxis(
                        new THREE.Vector3(
                            axis === 'x' ? 1 : 0,
                            axis === 'y' ? 1 : 0,
                            axis === 'z' ? 1 : 0
                        ), 
                        angle
                    );
                    
                    // 更新立方体位置并重置层组旋转
                    layerGroup.children.forEach(cube => {
                        cube.position.applyMatrix4(rotationMatrix);
                    });
                    layerGroup.rotation[axis] = 0;

                    // 更新颜色以反映真实的魔方旋转
                    updateColors(layerGroup, axis, angle);

                    layerGroup.rotating = false;
                }
            }
            update();
        }

        // 更新颜色函数
        function updateColors(layerGroup, axis, angle) {
            layerGroup.children.forEach(cube => {
                const oldMaterials = cube.material.slice();
                if (axis === 'z') {
                    if (angle === -Math.PI / 2) {
                        cube.material[0] = oldMaterials[3];
                        cube.material[3] = oldMaterials[5];
                        cube.material[5] = oldMaterials[2];
                        cube.material[2] = oldMaterials[0];
                    } else if (angle === Math.PI / 2) {
                        cube.material[0] = oldMaterials[2];
                        cube.material[2] = oldMaterials[5];
                        cube.material[5] = oldMaterials[3];
                        cube.material[3] = oldMaterials[0];
                    }
                }
                // 可以添加更多轴和角度的处理
            });
        }

        // 绑定按钮事件（修正旋转轴和方向）
        document.getElementById('rotate-front').addEventListener('click', 
            () => rotateLayer(layers[0], 'z', -Math.PI/2)); // 前面顺时针旋转
        document.getElementById('rotate-middle').addEventListener('click', 
            () => rotateLayer(layers[1], 'z', -Math.PI/2)); // 中间层顺时针旋转
        document.getElementById('rotate-back').addEventListener('click', 
            () => rotateLayer(layers[2], 'z', Math.PI/2)); // 后面逆时针旋转保持视觉一致

        // 打开/关闭对话框按钮事件
        const openDialogButton = document.getElementById('open-dialog');
        const dialog = document.getElementById('dialog');
        openDialogButton.addEventListener('click', function() {
            if (dialog.style.display === 'none' || dialog.style.display === '') {
                dialog.style.display = 'block';
                this.textContent = '关闭对话框';
            } else {
                dialog.style.display = 'none';
                this.textContent = '打开对话框';
            }
        });

        // 使对话框可移动
        const dialogHeader = document.getElementById('dialog-header');
        let isDragging = false;
        let offsetX, offsetY;

        dialogHeader.addEventListener('mousedown', function(e) {
            isDragging = true;
            offsetX = e.clientX - dialog.offsetLeft;
            offsetY = e.clientY - dialog.offsetTop;
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                dialog.style.left = (e.clientX - offsetX) + 'px';
                dialog.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
    </script>
</body>
</html>
