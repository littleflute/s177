<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* 保持原有样式不变 */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #333;
        }

        .mobile-container {
            max-width: 480px;
            margin: auto;
            background-color: #555;
            min-height: 100vh;
            color: white;
        }

        .topnav {
            background-color: #333;
            position: relative;
        }

        .topnav #myLinks {
            display: none;
        }

        .topnav a {
            color: white;
            padding: 14px 16px;
            text-decoration: none;
            display: block;
        }

        .topnav a.icon {
            background: black;
            position: absolute;
            right: 0;
            top: 0;
        }

        .active {
            background-color: #4CAF50;
        }

        .movable-modal {
            display: none;
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            z-index: 1000;
            width: 300px;
            user-select: none;
        }

        .movable-modal-header {
            padding: 10px;
            cursor: move;
            background: #4CAF50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px 4px 0 0;
        }

        .movable-modal-content {
            padding: 15px;
        }

        .modal-close {
            cursor: pointer;
            font-size: 20px;
            padding: 0 5px;
        }

        .modal-close:hover {
            color: #ff4444;
        }

        .issue_toolbar {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            padding: 10px 0;
            margin: 10px 0;
            order: -1; /* 新增：将工具栏移到内容顶部 */
        }

        .issue_btn {
            padding: 5px 10px;
            background: #4CAF50;
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .issue_btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <!-- 保持原有HTML结构不变 -->
    <div class="mobile-container">
        <div class="topnav">
            <div id="id_4_info">
                <a href="#home" class="active" id="id_4_toggleUI" onclick="appCore.toggleUI();" style="border:1px brown solid;">i14 v1.112</a> 
            </div>

            <div id="myLinks">
                <a href="https://littleflute.github.io/s177/" target="_blank">s177 Home</a>
                <a href="https://github.com/littleflute/s177" target="_blank">s177 Repo</a>
            </div>
            <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">
                <i class="fa fa-bars"></i>
            </a>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('myLinks');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        class C4XDR177I14 {
            constructor() { 
                this.currentRepo = 's177';
                this.currentIssue = 0;
                this.modal = null;
                this.isDragging = false;
                this.offsetX = 0;
                this.offsetY = 0;
                this.issuesLoaded = false;
                this.#injectStyles();
            }         
            
            #injectStyles() {
                const style = document.createElement('style');
                style.textContent = `
                    .movable-modal {
                        display: none;
                        position: fixed;
                        top: 100px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: #333;
                        color: white;
                        border: 1px solid #4CAF50;
                        border-radius: 5px;
                        z-index: 1000;
                        width: 300px;
                        user-select: none;
                    }
                    .movable-modal-header {
                        padding: 10px;
                        cursor: move;
                        background: #4CAF50;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        border-radius: 4px 4px 0 0;
                    }
                    .movable-modal-content {
                        padding: 15px;
                        display: flex;
                        flex-direction: column;
                    }
                    .modal-close {
                        cursor: pointer;
                        font-size: 20px;
                        padding: 0 5px;
                    }
                    .issue_toolbar {
                        display: flex;
                        overflow-x: auto;
                        gap: 5px;
                        padding: 10px 0;
                        margin: 10px 0;
                        order: -1;
                    }
                    .issue_btn {
                        padding: 5px 10px;
                        background: #4CAF50;
                        border: none;
                        border-radius: 3px;
                        color: white;
                        cursor: pointer;
                        white-space: nowrap;
                    }
                    .issue_btn:hover {
                        background: #45a049;
                    }
                `;
                document.head.appendChild(style);
            }

            #createModal() {
                if (this.modal) return;

                this.modal = document.createElement('div');
                this.modal.className = 'movable-modal';
                this.modal.innerHTML = `
                    <div class="movable-modal-header">
                        <span>Control Panel</span>
                        <span class="modal-close">×</span>
                    </div>
                    <div class="movable-modal-content">
                        <!-- 将issue_toolbar移动到内容区域顶部 -->
                        <div id="issue_toolbar" class="issue_toolbar"></div>
                        <p>Current Repo: <span id="current-repo">${this.currentRepo}</span></p>
                        <p>Current Issue: <span id="current-issue">${this.currentIssue}</span></p>
                        <button onclick="appCore.toggleUI()">Close Window</button>
                    </div>
                `;

                document.body.appendChild(this.modal);

                const header = this.modal.querySelector('.movable-modal-header');
                const closeBtn = this.modal.querySelector('.modal-close');

                closeBtn.addEventListener('click', () => this.toggleUI());

                header.addEventListener('mousedown', (e) => {
                    this.startDrag(e.clientX, e.clientY);
                });

                header.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.startDrag(touch.clientX, touch.clientY);
                });
            }

            /* 保持其他方法不变 */
            async fetchAndDisplayIssues() {
                try {
                    const issues = await this.#apiRequest('GET', 'issues?per_page=100', null);
                    const toolbar = document.getElementById('issue_toolbar');
                    toolbar.innerHTML = '';
                    
                    issues.forEach(issue => {
                        const btn = document.createElement('button');
                        btn.className = 'issue_btn';
                        btn.textContent = `#${issue.number}`;
                        btn.onclick = () => {
                            this.currentIssue = issue.number;
                            document.getElementById('current-issue').textContent = this.currentIssue;
                        };
                        toolbar.appendChild(btn);
                    });
                    
                    this.issuesLoaded = true;
                } catch (error) {
                    console.error('Failed to fetch issues:', error);
                }
            }

            startDrag(clientX, clientY) {
                this.isDragging = true;
                const rect = this.modal.getBoundingClientRect();
                this.offsetX = clientX - rect.left;
                this.offsetY = clientY - rect.top;

                const onMouseMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    this.modal.style.left = `${e.clientX - this.offsetX}px`;
                    this.modal.style.top = `${e.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onTouchMove = (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.modal.style.left = `${touch.clientX - this.offsetX}px`;
                    this.modal.style.top = `${touch.clientY - this.offsetY}px`;
                    this.modal.style.transform = 'none';
                };

                const onMouseUp = () => {
                    this.isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                const onTouchEnd = () => {
                    this.isDragging = false;
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                document.addEventListener('touchmove', onTouchMove);
                document.addEventListener('touchend', onTouchEnd);
            }

            toggleUI() {
                this.#createModal();
                const isShowing = this.modal.style.display !== 'none';
                this.modal.style.display = isShowing ? 'none' : 'block';
                
                if (!isShowing && !this.issuesLoaded) {
                    this.fetchAndDisplayIssues();
                }

                if (!isShowing && !this.modal.style.left) {
                    const rect = this.modal.getBoundingClientRect();
                    this.modal.style.left = `${window.innerWidth/2 - rect.width/2}px`;
                    this.modal.style.top = `${window.innerHeight/2 - rect.height/2}px`;
                }
            }

            async #apiRequest(method, endpoint, data) {
                const xdToken = "ghp_2BF" + "JztcBlHHOkBybs" + "UVJZGHQ4S" + "wvFR0poLqc";
                const url = `https://api.github.com/repos/littleflute/${this.currentRepo}/${endpoint}`;
                
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Authorization': `token ${xdToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: data ? JSON.stringify(data) : null
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            }
        }

        const appCore = new C4XDR177I14();
    </script>
</body>
</html>
