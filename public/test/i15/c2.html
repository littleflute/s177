<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube Window</title>
</head>

<body>
    <button onclick="btnTest();">Toggle Cube</button>
    <script>
        class MovableWindow {
            constructor(title, width = 600, height = 400) {
                this.isDragging = false;
                this.offset = [0, 0];

                this.element = document.createElement('div');
                this.element.className = 'window';
                this.element.style.width = `${width}px`;
                this.element.style.height = `${height}px`;
                this.element.style.position = 'absolute';
                this.element.style.border = '2px solid #444';
                this.element.style.background = '#ddd';
                this.element.style.boxShadow = '5px 5px 10px rgba(0,0,0,0.3)';
                this.element.style.left = '20px';
                this.element.style.top = '20px';
                this.element.style.zIndex = '2222';

                this.titleBar = document.createElement('div');
                this.titleBar.className = 'title-bar';
                this.titleBar.textContent = title;
                this.titleBar.style.background = '#666';
                this.titleBar.style.color = 'white';
                this.titleBar.style.padding = '5px';
                this.titleBar.style.cursor = 'move';

                this.canvasContainer = document.createElement('div');
                this.canvasContainer.className = 'canvas-container';
                this.canvasContainer.style.position = 'relative';
                this.canvasContainer.style.overflow = 'hidden';
                this.canvasContainer.style.width = '100%';
                this.canvasContainer.style.height = 'calc(100% - 60px)';
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvasContainer.appendChild(this.canvas);

                this.toolbar = document.createElement('div');
                this.toolbar.className = 'toolbar';
                this.toolbar.style.background = '#aaa';
                this.toolbar.style.padding = '5px';
                this.toolbar.style.display = 'flex';
                this.toolbar.style.gap = '5px';
                this.toolbar.style.position = 'absolute';
                this.toolbar.style.bottom = '0';
                this.toolbar.style.width = '100%';
                this.toolbar.style.boxSizing = 'border-box';

                this.element.append(this.titleBar, this.canvasContainer, this.toolbar);
                document.body.appendChild(this.element);

                this.titleBar.addEventListener('mousedown', e => this.startDrag(e));
                document.addEventListener('mousemove', e => this.doDrag(e));
                document.addEventListener('mouseup', () => this.stopDrag());
                window.addEventListener('resize', () => this.resizeCanvas());
                this.resizeCanvas();
            }

            startDrag(e) {
                this.isDragging = true;
                const rect = this.element.getBoundingClientRect();
                this.offset = [e.clientX - rect.left, e.clientY - rect.top];
            }

            doDrag(e) {
                if (!this.isDragging) return;
                this.element.style.left = (e.clientX - this.offset[0]) + 'px';
                this.element.style.top = (e.clientY - this.offset[1]) + 'px';
            }

            stopDrag() {
                this.isDragging = false;
            }

            resizeCanvas() {
                this.canvas.width = this.canvasContainer.clientWidth;
                this.canvas.height = this.canvasContainer.clientHeight;
            }

            addButton(text, onClick) {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.addEventListener('click', onClick);
                this.toolbar.appendChild(btn);
                return btn;
            }
        }

        class CubeWindow extends MovableWindow {
            constructor() {
                super('3D Rubik\'s Cube');
                this.angle = 0;
                this.rotationEnabled = false;
                this.scale = 100;

                const positions = [-2/3, 0, 2/3];
                this.cubeCenters = [];
                for (let x of positions) {
                    for (let y of positions) {
                        for (let z of positions) {
                            this.cubeCenters.push([x, y, z]);
                        }
                    }
                }

                this.localVertices = [
                    [-1/3, -1/3, -1/3], [1/3, -1/3, -1/3],
                    [1/3, 1/3, -1/3], [-1/3, 1/3, -1/3],
                    [-1/3, -1/3, 1/3], [1/3, -1/3, 1/3],
                    [1/3, 1/3, 1/3], [-1/3, 1/3, 1/3]
                ];

                this.faces = [
                    [0, 1, 2, 3], [1, 5, 6, 2],
                    [5, 4, 7, 6], [4, 0, 3, 7],
                    [3, 2, 6, 7], [4, 5, 1, 0]
                ];

                this.faceColors = [
                    '#FF0000', '#00FF00', '#0000FF', 
                    '#FFFF00', '#00FFFF', '#FF00FF'
                ];

                this.initControls();
                this.animate();
            }

            initControls() {
                this.addButton('旋转', () => this.toggleRotation());
                this.addButton('属性', () => this.showPropertyPanel());
                this.addButton('Y转90', () => {
                    if (!this.rotationEnabled) {
                        this.angle += Math.PI / 2;
                    }
                });
                this.addButton('Y转15', () => {
                    if (!this.rotationEnabled) {
                        this.angle += Math.PI / 12;
                    }
                });
                // 新增Y转45按钮
                this.addButton('Y转45', () => {
                    if (!this.rotationEnabled) {
                        this.angle += Math.PI / 4;
                    }
                });
            }

            toggleRotation() {
                this.rotationEnabled = !this.rotationEnabled;
            }

            showPropertyPanel() {
                if (!this.propWindow) {
                    const propWidth = 200;
                    const propHeight = 100;
                    this.propWindow = new MovableWindow('属性', propWidth, propHeight);
                    this.propWindow.element.style.left = '640px';

                    const panel = document.createElement('div');
                    panel.innerHTML = `
                        <label>
                            缩放: 
                            <input type="range" min="50" max="200" step="10" value="100">
                        </label>
                    `;

                    panel.querySelector('input').addEventListener('input', e => {
                        this.scale = parseFloat(e.target.value);
                    });

                    this.propWindow.element.appendChild(panel);
                } else {
                    this.propWindow.element.style.display = 
                        this.propWindow.element.style.display === 'none' ? 'block' : 'none';
                }
            }

            project(vertex) {
                const fov = 300;
                const scale = this.scale * 50;
                return [
                    vertex[0] * scale / (vertex[2] + fov) + this.canvas.width / 2,
                    -vertex[1] * scale / (vertex[2] + fov) + this.canvas.height / 2
                ];
            }

            rotate(vertex) {
                const [x, y, z] = vertex;
                const cosY = Math.cos(this.angle);
                const sinY = Math.sin(this.angle);

                const x1 = x * cosY + z * sinY;
                const z1 = -x * sinY + z * cosY;

                return [x1, y, z1];
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.drawAxes();
                this.drawCube();
            }

            drawAxes() {
                const axes = [
                    { points: [[0, 0, 0], [2, 0, 0]], color: '#f00', label: 'X' },
                    { points: [[0, 0, 0], [0, 2, 0]], color: '#0f0', label: 'Y' },
                    { points: [[0, 0, 0], [0, 0, 2]], color: '#00f', label: 'Z' }
                ];

                axes.forEach(axis => {
                    const start = this.project(this.rotate(axis.points[0]));
                    const end = this.project(this.rotate(axis.points[1]));

                    this.ctx.beginPath();
                    this.ctx.strokeStyle = axis.color;
                    this.ctx.moveTo(start[0], start[1]);
                    this.ctx.lineTo(end[0], end[1]);
                    this.ctx.stroke();

                    this.ctx.fillStyle = '#000';
                    this.ctx.font = '12px Arial';
                    this.ctx.fillText(axis.label, end[0] + 5, end[1] + 5);
                });
            }

            drawCube() {
                for (const center of this.cubeCenters) {
                    const cubeVertices = this.localVertices.map(v => [
                        center[0] + v[0],
                        center[1] + v[1],
                        center[2] + v[2]
                    ]);

                    const rotatedVertices = cubeVertices.map(v => this.rotate(v));

                    const faceData = this.faces.map((face, index) => {
                        const points = face.map(i => rotatedVertices[i]);
                        const centerZ = points.reduce((sum, v) => sum + v[2], 0) / points.length;
                        return { points, centerZ, color: this.faceColors[index] };
                    });

                    faceData.sort((a, b) => b.centerZ - a.centerZ);

                    faceData.forEach(({ points, color }) => {
                        const normal = this.calculateNormal(points);
                        if (normal[2] < 0) return;

                        this.ctx.beginPath();
                        points.forEach((v, i) => {
                            const p = this.project(v);
                            if (i === 0) this.ctx.moveTo(p[0], p[1]);
                            else this.ctx.lineTo(p[0], p[1]);
                        });
                        this.ctx.closePath();
                        this.ctx.fillStyle = color;
                        this.ctx.fill();
                        this.ctx.strokeStyle = '#000';
                        this.ctx.stroke();
                    });
                }
            }

            calculateNormal(points) {
                const v1 = [points[1][0] - points[0][0], points[1][1] - points[0][1], points[1][2] - points[0][2]];
                const v2 = [points[2][0] - points[0][0], points[2][1] - points[0][1], points[2][2] - points[0][2]];
                return [
                    v1[1] * v2[2] - v1[2] * v2[1],
                    v1[2] * v2[0] - v1[0] * v2[2],
                    v1[0] * v2[1] - v1[1] * v2[0]
                ];
            }

            animate() {
                if (this.rotationEnabled) this.angle += 0.03;
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        let cubeWindowInstance = null;
        
        function btnTest() {
            if (!cubeWindowInstance) {
                cubeWindowInstance = new CubeWindow();
            } else {
                cubeWindowInstance.element.style.display = 
                    cubeWindowInstance.element.style.display === 'none' ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
