<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移动端音乐播放器</title>
</head>
<body>
    <button id="openWindowBtn">🎵 打开播放器</button>

    <script>
    class MovableWindow {
        constructor(title, contentHTML) {
            this.isDragging = false;
            this.initialized = false;
            this.createWindowElement(title, contentHTML);
            this.addStyles();
            this.bindEvents();
        }

        createWindowElement(title, contentHTML) {
            this.modal = document.createElement('div');
            this.modal.className = 'movable-window';
            this.modal.innerHTML = `
                <div class="window-header">
                    <span>${title}</span>
                    <button class="close-btn">&times;</button>
                </div>
                <div class="window-content">
                    ${contentHTML}
                </div>
            `;
            document.body.appendChild(this.modal);
        }

        addStyles() {
            if (document.getElementById('movable-window-styles')) return;
            
            const style = document.createElement('style');
            style.id = 'movable-window-styles';
            style.textContent = ` 
            .lyrics-toolbar {
                padding: 12px;
                background: #f8f9fa;
                border-bottom: 1px solid #dee2e6;
                display: flex;
                gap: 10px;
            }

            .toolbar-btn {
                padding: 8px 16px;
                background: #17a2b8;
                color: white;
                border: none;
                border-radius: 20px;
                font-size: 0.9rem;
                touch-action: manipulation;
                transition: transform 0.1s;
            }
            .toolbar-btn:active {
                transform: scale(0.95);
            }
                #toggleLyricsBtn {
                    background: #17a2b8;
                    width: auto;
                    padding: 0 20px;
                    border-radius: 30px;
                    font-size: 1rem;
                }

                .movable-window {
                    display: none;
                    position: fixed;
                    width: 90%;
                    max-width: 400px;
                    height: 70vh;
                    background: #fff;
                    border-radius: 12px;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
                    z-index: 1000;
                    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                    touch-action: none;
                    overflow: hidden;
                }

                .window-header {
                    padding: 16px;
                    background: #f8f9fa;
                    border-bottom: 1px solid #dee2e6;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    -webkit-tap-highlight-color: transparent;
                }

                .close-btn {
                    background: none;
                    border: none;
                    font-size: 1.8rem;
                    width: 44px;
                    height: 44px;
                    line-height: 44px;
                }

                .window-content {
                    padding: 16px;
                    height: calc(100% - 62px);
                    overflow-y: auto;
                    -webkit-overflow-scrolling: touch;
                }

                /* 进度条样式 */
                .progress-container {
                    height: 8px;
                    background: #e9ecef;
                    border-radius: 4px;
                    margin: 20px 0;
                    touch-action: none;
                }

                .progress-bar {
                    height: 100%;
                    background: #007bff;
                    border-radius: 4px;
                    transition: width 0.1s linear;
                }

                /* 播放控制 */
                .player-controls {
                    gap: 10px;
                    margin: 15px 0;
                }

                .player-controls button {
                    width: 60px;
                    height: 60px;
                    border-radius: 50%;
                    border: none;
                    background: #007bff;
                    color: white;
                    font-size: 1.4rem;
                    touch-action: manipulation;
                    transition: transform 0.1s;
                }

                .player-controls button:active {
                    transform: scale(0.95);
                }

                /* 播放列表 */
                .playlist-container {
                    flex-grow: 1;
                    max-height: 40vh;
                    overflow-y: auto;
                }

                #playlist {
                    list-style: none;
                    padding: 0;
                    margin: 0;
                }

                #playlist li {
                    padding: 12px;
                    border-bottom: 1px solid #eee;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    transition: background 0.2s;
                }

                #playlist li.current-track {
                    background: #e3f2fd;
                }

                /* 歌词样式 */
                .lyrics-container {
                    height: 50vh;
                    padding: 16px;
                    font-size: 1.1rem;
                    line-height: 1.8;
                    text-align: center;
                    overflow-y: auto;
                    -webkit-overflow-scrolling: touch;
                }

                .current-lyric {
                    color: #007bff;
                    font-weight: bold;
                    transform: scale(1.05);
                }

                /* 移动端优化 */
                @media (max-width: 480px) {
                    .movable-window {
                        width: 95%;
                        height: 80vh;
                    }
                    
                    .player-controls button {
                        width: 55px;
                        height: 55px;
                    }
                }

                /* 文件上传按钮 */
                .file-upload-wrapper {
                    margin-top: 15px;
                    text-align: center;
                }

                .file-upload-btn {
                    display: inline-block;
                    padding: 12px 24px;
                    background: #28a745;
                    color: white;
                    border-radius: 25px;
                    cursor: pointer;
                    transition: background 0.2s;
                }

                .file-upload-btn:active {
                    background: #218838;
                }

                #currentSong {
                    display: block;
                    text-align: center;
                    font-size: 1.1rem;
                    margin: 15px 0;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
            `;
            document.head.appendChild(style);
        }

        bindEvents() {
            const header = this.modal.querySelector('.window-header');
            
            // 触摸事件
            header.addEventListener('touchstart', (e) => this.handleStart(e.touches[0]));
            document.addEventListener('touchmove', (e) => this.handleMove(e.touches[0]), { passive: false });
            document.addEventListener('touchend', () => this.handleEnd());

            // 鼠标事件
            header.addEventListener('mousedown', (e) => this.handleStart(e));
            document.addEventListener('mousemove', (e) => this.handleMove(e));
            document.addEventListener('mouseup', () => this.handleEnd());

            this.modal.querySelector('.close-btn').addEventListener('click', () => this.hide());
        }

        handleStart(e) {
            this.isDragging = true;
            const rect = this.modal.getBoundingClientRect();
            // 计算鼠标点击位置相对于窗口左上角的偏移
            this.offsetX = e.clientX - rect.left;
            this.offsetY = e.clientY - rect.top;
            this.modal.style.transition = 'none';
        }

        handleMove(e) {
            if (!this.isDragging) return;
            
            // 根据偏移量计算新位置
            const newX = e.clientX - this.offsetX;
            const newY = e.clientY - this.offsetY;
            
            // 边界限制
            const maxX = window.innerWidth - this.modal.offsetWidth;
            const maxY = window.innerHeight - this.modal.offsetHeight;
            
            this.modal.style.left = `${Math.min(Math.max(0, newX), maxX)}px`;
            this.modal.style.top = `${Math.min(Math.max(0, newY), maxY)}px`;
        }

        handleEnd() {
            this.isDragging = false;
            this.modal.style.transition = 'all 0.3s ease';
        }

        show() {
            if (!this.initialized) {
                this.centerPosition();
                this.initialized = true;
            }
            this.modal.style.display = 'block';
        }

        hide() {
            this.modal.style.display = 'none';
        }

        centerPosition() {
            // 改用像素值定位，移除transform
            const left = (window.innerWidth - this.modal.offsetWidth) / 2;
            const top = (window.innerHeight - this.modal.offsetHeight) / 2;
            this.modal.style.left = `${left}px`;
            this.modal.style.top = `${top}px`;
            this.modal.style.transform = 'none';
        }

        getContentContainer() {
            return this.modal.querySelector('.window-content');
        }
    }

    class C4Playlist {
        constructor() {
            this.tracks = [];
            this.currentIndex = 0;
            this.listeners = [];
        }

        onUpdate(callback) {
            this.listeners.push(callback);
        }

        notifyUpdate() {
            this.listeners.forEach(cb => cb());
        }

        addTrack(track) {
            this.tracks.push(track);
            this.notifyUpdate();
        }

        removeTrack(index) {
            if (index < 0 || index >= this.tracks.length) return;
            this.tracks.splice(index, 1);
            if (this.currentIndex >= index) this.currentIndex = Math.max(0, this.currentIndex - 1);
            this.notifyUpdate();
        }

        setCurrentIndex(index) {
            if (index >= 0 && index < this.tracks.length) {
                this.currentIndex = index;
                this.notifyUpdate();
            }
        }

        next() {
            this.currentIndex = (this.currentIndex + 1) % this.tracks.length;
            this.notifyUpdate();
        }

        prev() {
            this.currentIndex = (this.currentIndex - 1 + this.tracks.length) % this.tracks.length;
            this.notifyUpdate();
        }

        getCurrentTrack() {
            return this.tracks[this.currentIndex] || null;
        }

        getTracks() {
            return [...this.tracks];
        }
    }

    class C4ProgressBar {
        constructor(containerSelector, audioElement) {
            this.container = document.querySelector(containerSelector);
            this.progressBar = this.container.querySelector('.progress-bar');
            this.audio = audioElement;
            this.isSeeking = false;
            this.init();
        }

        init() {
            // 触摸事件
            this.container.addEventListener('touchstart', (e) => this.startSeeking(e.touches[0]));
            document.addEventListener('touchmove', (e) => this.handleSeeking(e.touches[0]), { passive: false });
            document.addEventListener('touchend', () => this.stopSeeking());

            // 鼠标事件
            this.container.addEventListener('mousedown', (e) => this.startSeeking(e));
            document.addEventListener('mousemove', (e) => this.handleSeeking(e));
            document.addEventListener('mouseup', () => this.stopSeeking());

            this.audio.addEventListener('timeupdate', () => this.updateProgress());
            this.audio.addEventListener('loadedmetadata', () => this.updateDuration());
        }

        startSeeking(e) {
            this.isSeeking = true;
            this.seek(e);
        }

        handleSeeking(e) {
            if (!this.isSeeking) return;
            this.seek(e);
        }

        stopSeeking() {
            this.isSeeking = false;
        }

        seek(e) {
            const rect = this.container.getBoundingClientRect();
            const position = (e.clientX - rect.left) / rect.width;
            this.audio.currentTime = position * this.audio.duration;
        }

        updateProgress() {
            if (this.isSeeking) return;
            const progress = (this.audio.currentTime / this.audio.duration) * 100;
            this.progressBar.style.width = `${progress}%`;
            document.getElementById('currentTime').textContent = this.formatTime(this.audio.currentTime);
        }

        updateDuration() {
            document.getElementById('duration').textContent = this.formatTime(this.audio.duration);
        }

        formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
    }

    class C4Player {
        constructor(playlist) {
            this.playlist = playlist;
            this.audio = new Audio();
            this.isPlaying = false;
            this.progressBar = new C4ProgressBar('.progress-container', this.audio);
            
            this.audio.addEventListener('ended', () => this.next());
            this.audio.addEventListener('timeupdate', () => this.updateLyrics());
            this.bindLyricEvents();
        }
        bindLyricEvents() {
            const lyricsContainer = document.getElementById('lyricsDisplay');
            lyricsContainer.addEventListener('click', (e) => {
                const lyricLine = e.target.closest('.lyric-line');
                if (lyricLine && this.audio) {
                    const startTime = parseFloat(lyricLine.dataset.start);
                    this.audio.currentTime = startTime;
                    
                    // 如果当前是暂停状态则自动播放
                    if (!this.isPlaying) {
                        this.play();
                        document.getElementById('playPauseBtn').textContent = '❚❚';
                    }
                }
            });
        }
        
        loadTrack() {
            const track = this.playlist.getCurrentTrack();
            if (track) {
                this.audio.src = track.src;
                document.getElementById('currentSong').textContent = track.name;
                
                // 新增：自动加载歌词
                if (track.srt) {
                    fetch(track.srt)
                        .then(response => {
                            if (!response.ok) throw new Error('歌词加载失败');
                            return response.text();
                        })
                        .then(text => {
                            const lyrics = SrtParser.parse(text);
                            const lyricsHTML = lyrics.map(l => 
                                `<div class="lyric-line" data-start="${l.start}" data-end="${l.end}">${l.text}</div>`
                            ).join('');
                            document.getElementById('lyricsDisplay').innerHTML = lyricsHTML;
                        })
                        .catch(error => {
                            console.error('歌词加载失败:', error);
                            document.getElementById('lyricsDisplay').innerHTML = '歌词加载失败';
                        });
                } else {
                    document.getElementById('lyricsDisplay').innerHTML = '';
                }
            } else {
                this.audio.src = '';
                document.getElementById('currentSong').textContent = '-- 没有正在播放的歌曲 --';
                document.getElementById('lyricsDisplay').innerHTML = '';
            }
        }

        play() {
            this.isPlaying = true;  // 立即更新状态
            return this.audio.play().catch((error) => {
                this.isPlaying = false; // 播放失败时回滚状态
                console.error('播放失败:', error);
            });
        }

        pause() {
            this.audio.pause();
            this.isPlaying = false;
        }

        toggle() {
            this.isPlaying ? this.pause() : this.play();
        }

        next() {
            this.playlist.next();
            this.loadTrack();
            if (this.isPlaying) this.play();
        }

        prev() {
            this.playlist.prev();
            this.loadTrack();
            if (this.isPlaying) this.play();
        }

        updateLyrics() {
            const currentTime = this.audio.currentTime;
            const lyrics = document.querySelectorAll('.lyric-line');
            let activeIndex = -1;

            lyrics.forEach((line, index) => {
                const start = parseFloat(line.dataset.start);
                const end = parseFloat(line.dataset.end);
                
                if (currentTime >= start && currentTime < end) {
                    line.classList.add('current-lyric');
                    activeIndex = index;
                } else {
                    line.classList.remove('current-lyric');
                }
            });

            if (activeIndex > -1) {
                const lyricElement = lyrics[activeIndex];
                const container = document.querySelector('.lyrics-container');
                const elementTop = lyricElement.offsetTop;
                const elementHeight = lyricElement.offsetHeight;
                const containerHeight = container.offsetHeight;
                
                container.scrollTo({
                    top: elementTop - (containerHeight/2) + (elementHeight/2),
                    behavior: 'smooth'
                });
            }
        }
    }

    class SrtParser {
        static parse(text) {
            return text.split(/\n\s*\n/)
                .filter(block => block.trim())
                .map(block => {
                    const lines = block.split('\n').filter(l => l.trim());
                    if (lines.length < 3) return null;
                    
                    const timecode = lines[1].match(/(\d+:\d+:\d+[\.,]\d+).*?(\d+:\d+:\d+[\.,]\d+)/);
                    if (!timecode) return null;

                    const start = this.timeToSeconds(timecode[1]);
                    const end = this.timeToSeconds(timecode[2]);
                    const text = lines.slice(2).join('\n');

                    return { start, end, text };
                })
                .filter(Boolean);
        }

        static timeToSeconds(time) {
            const parts = time.replace(',', '.').split(':');
            const hours = parseFloat(parts[0]);
            const minutes = parseFloat(parts[1]);
            const seconds = parseFloat(parts[2]);
            return hours * 3600 + minutes * 60 + seconds;
        }
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', () => {
        // 创建播放器窗口
        const playerWindow = new MovableWindow('音乐播放器', `
        <div id="currentSong">-- 没有正在播放的歌曲 --</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">00:00</span> / 
            <span id="duration">00:00</span>
        </div>
        <div class="player-controls">
            <button id="prevBtn">◀◀</button>
            <button id="playPauseBtn">▶</button>
            <button id="nextBtn">▶▶</button>
            <button id="toggleLyricsBtn">🎵 歌词</button>
        </div>
        <div class="playlist-container">
            <ul id="playlist"></ul>
            <div class="file-upload-wrapper">
                <input type="file" id="fileInput" accept="audio/*" hidden>
                <label for="fileInput" class="file-upload-btn">添加本地音乐</label>
            </div>
        </div>
    `);

        // 创建歌词窗口
        const lyricsWindow = new MovableWindow('歌词', `
            <div class="lyrics-toolbar">
                <button id="loadPresetLyricBtn" class="toolbar-btn">预置歌词</button>
            </div>
            <div class="lyrics-container">
                <div id="lyricsDisplay"></div>
                <div class="file-upload-wrapper" style="margin-top:20px">
                    <input type="file" id="srtFileInput" accept=".srt" hidden>
                    <label for="srtFileInput" class="file-upload-btn">加载本地歌词</label>
                </div>
            </div>
        `);
        lyricsWindow.hide();

        // 初始化播放列表和播放器
        const playlist = new C4Playlist();
        const player = new C4Player(playlist);
        let currentLyrics = [];

        // 播放列表渲染
        function renderPlaylist() {
            const listElement = document.getElementById('playlist');
            listElement.innerHTML = playlist.getTracks().map((track, index) => `
                <li class="${index === playlist.currentIndex ? 'current-track' : ''}">
                    <span>${track.name}</span>
                    <button class="delete-btn" data-index="${index}">×</button>
                </li>
            `).join('');
        }

        document.getElementById('loadPresetLyricBtn').addEventListener('click', () => {
            const srtUrl = 'https://littleflute.github.io/s177/public/p.srt';
            
            fetch(srtUrl)
                .then(response => response.text())
                .then(text => {
                    currentLyrics = SrtParser.parse(text);
                    document.getElementById('lyricsDisplay').innerHTML = currentLyrics
                        .map(l => `<div class="lyric-line" data-start="${l.start}" data-end="${l.end}">${l.text}</div>`)
                        .join('');
                })
                .catch(error => {
                    console.error('歌词加载失败:', error);
                    alert('预置歌词加载失败，请检查网络连接');
                });
        });
        document.getElementById('openWindowBtn').addEventListener('click', () => playerWindow.show());
        document.getElementById('toggleLyricsBtn').addEventListener('click', () => lyricsWindow.show());

        // 播放控制
        playerWindow.getContentContainer().addEventListener('click', (e) => {
            const target = e.target;
            if (target.id === 'toggleLyricsBtn') {
                lyricsWindow.show();
                return;
            }
            if (target.id === 'playPauseBtn') {
                player.toggle();
                target.textContent = player.isPlaying ? '❚❚' : '▶';
            }
            if (target.id === 'prevBtn') player.prev();
            if (target.id === 'nextBtn') player.next();
        });

        // 播放列表交互
        document.getElementById('playlist').addEventListener('click', (e) => {
            const target = e.target;
            if (target.classList.contains('delete-btn')) {
                playlist.removeTrack(parseInt(target.dataset.index));
                return;
            }
            const li = target.closest('li');
            if (li) {
                const index = Array.from(li.parentNode.children).indexOf(li);
                playlist.setCurrentIndex(index);
                player.loadTrack();
                if (player.isPlaying) player.play();
            }
        });

        // 文件上传
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('audio/')) {
                playlist.addTrack({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    src: URL.createObjectURL(file)
                });
                e.target.value = '';
            }
        });

        // 歌词处理
        document.getElementById('srtFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentLyrics = SrtParser.parse(event.target.result);
                    document.getElementById('lyricsDisplay').innerHTML = currentLyrics
                        .map(l => `<div class="lyric-line" data-start="${l.start}" data-end="${l.end}">${l.text}</div>`)
                        .join('');
                };
                reader.readAsText(file);
            }
        });

        // 在初始化代码中添加歌词容器样式优化（阻止长按菜单）
        document.getElementById('lyricsDisplay').style.webkitTouchCallout = 'none';
        document.getElementById('lyricsDisplay').style.userSelect = 'none';
        // 初始化示例音乐
        playlist.addTrack({ name: "程序员之歌v0.3", src: "https://littleflute.github.io/s177/public/p3.mp3",srt:"p.srt" });
        playlist.addTrack({ name: "程序员之歌v0.6", src: "https://littleflute.github.io/s177/public/p6.mp3",srt:"p.srt" });
        playlist.addTrack({ name: "程序员之歌伴奏1", src: "https://littleflute.github.io/s177/public/p6c.mp3",srt:"p.srt" });
        playlist.addTrack({ name: "程序员之歌伴奏2", src: "pc2.mp3" ,srt:"p.srt"});
        playlist.onUpdate(renderPlaylist);
        player.loadTrack();
        renderPlaylist();

        // 移动端优化：阻止双击缩放
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) e.preventDefault();
            lastTap = now;
        }, { passive: false });
    });
    </script>
</body>
</html>
