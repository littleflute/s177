<!--
做一个网页模拟三维数字魔方。在画布上实现,用three.js
特性：

完整实现的3D数字魔方，每个面颜色不同，都有独立编号（11-19,21-29...)
前后面（Z轴方向）：使用标准坐标计算 
左右面（X轴方向）：调整X坐标方向 
顶底面（Y轴方向）：交换X/Y坐标
生成以下编号模式：

前面：11,12,13...19

右面：21,22,23...29

顶面：31,32,33...39

后面：41,42,43...49

底面：51,52,53...59

左面：61,62,63...69


专业级光照效果（环境光+方向光）

优化的材质系统（Phong材质）

增强的轴指示系统（带标签的3D坐标轴）

流畅的动画控制系统（支持暂停/继续）

自然的手动旋转交互

响应式布局支持

智能数字标签定位系统

抗锯齿渲染

优化的性能表现

使用方法：

初始状态魔方静止

点击按钮启动/暂停自动旋转

在暂停状态下可用鼠标拖拽旋转

窗口自动适应屏幕尺寸

数字标签自动面向观察者方向

包含完整的3D坐标轴指示,坐标轴箭头处显示X,Y,Z字样，旋转时坐标轴也旋转
-->
 
<!-- by 
 
 -->
<!DOCTYPE html>
<html>
<head>
    <title>3D数字魔方</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="toggle">启动/暂停旋转</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let autoRotate = false;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const labels = [];
        
        // 初始化场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建魔方容器组
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        // 设置相机位置
        camera.position.z = 8;

        // 光照系统
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 创建坐标轴系统
        function createAxis() {
            const axes = [];
            const colors = [0xff0000, 0x00ff00, 0x0000ff];
            const directions = [
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, 0, 1)
            ];
            
            directions.forEach((dir, i) => {
                const arrow = new THREE.ArrowHelper(
                    dir, 
                    new THREE.Vector3(0, 0, 0),
                    3, 
                    colors[i], 
                    0.3, 
                    0.2
                );
                axes.push(arrow);
                
                // 坐标轴标签
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 64;
                canvas.height = 64;
                context.font = '24px Arial';
                context.fillStyle = colors[i].toString(16).padStart(6, '0');
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(['X', 'Y', 'Z'][i], 32, 32);
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(0.5, 0.5, 1);
                sprite.position.copy(dir.multiplyScalar(3.5));
                axes.push(sprite);
            });
            
            axes.forEach(axis => cubeGroup.add(axis));
        }
        createAxis();

        // 生成数字纹理
        function createNumberTexture(number, hue) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256;
            
            // 背景颜色
            context.fillStyle = `hsl(${hue * 60}, 80%, 50%)`;
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            // 数字文字
            context.font = '100px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = 'white';
            context.fillText(number.toString(), 128, 128);
            
            return new THREE.CanvasTexture(canvas);
        }

        // 创建魔方表面
        const faceConfigs = [
            { dir: new THREE.Vector3(0, 0, 1), color: 0, start: 11 },  // 前面
            { dir: new THREE.Vector3(0, 0, -1), color: 1, start: 41 }, // 后面
            { dir: new THREE.Vector3(1, 0, 0), color: 2, start: 21 },  // 右面
            { dir: new THREE.Vector3(-1, 0, 0), color: 3, start: 61 }, // 左面
            { dir: new THREE.Vector3(0, 1, 0), color: 4, start: 31 },  // 顶面
            { dir: new THREE.Vector3(0, -1, 0), color: 5, start: 51 }  // 底面
        ];

        faceConfigs.forEach(config => {
            for(let x = -1; x <= 1; x++) {
                for(let y = -1; y <= 1; y++) {
                    // 计算正确的位置
                    const position = new THREE.Vector3()
                        .add(config.dir)
                        .add(
                            new THREE.Vector3(
                                (config.dir.y !== 0 || config.dir.z !== 0) ? x : 0,
                                (config.dir.x !== 0 || config.dir.z !== 0) ? y : 0,
                                0
                            )
                        );

                    // 计算正确的编号
                    const number = config.start + 
                        (config.dir.z !== 0 ? (1 - y) * 3 + (x + 1) :
                        config.dir.x !== 0 ? (1 - y) * 3 + (1 - x) :
                        (x + 1) * 3 + (1 - y);

                    // 创建面片
                    const geometry = new THREE.PlaneGeometry(0.95, 0.95);
                    const material = new THREE.MeshPhongMaterial({
                        color: `hsl(${config.color * 60}, 80%, 50%)`,
                        shininess: 100
                    });
                    const plane = new THREE.Mesh(geometry, material);
                    plane.position.copy(position);
                    plane.lookAt(position.clone().add(config.dir));
                    cubeGroup.add(plane);

                    // 创建数字标签
                    const labelGeometry = new THREE.PlaneGeometry(0.6, 0.6);
                    const labelMaterial = new THREE.MeshBasicMaterial({
                        map: createNumberTexture(number, config.color),
                        transparent: true
                    });
                    const label = new THREE.Mesh(labelGeometry, labelMaterial);
                    label.position.copy(position).add(config.dir.clone().multiplyScalar(0.01));
                    labels.push(label);
                    cubeGroup.add(label);
                }
            }
        });

        // 交互控制
        document.getElementById('toggle').addEventListener('click', () => {
            autoRotate = !autoRotate;
        });

        // 鼠标事件
        renderer.domElement.addEventListener('mousedown', e => {
            if(!autoRotate) {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mousemove', e => {
            if(isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                cubeGroup.rotation.y += deltaX * 0.01;
                cubeGroup.rotation.x += deltaY * 0.01;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // 响应式布局
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新标签方向
            labels.forEach(label => {
                label.quaternion.copy(camera.quaternion);
            });

            // 自动旋转
            if(autoRotate) {
                cubeGroup.rotation.x += 0.005;
                cubeGroup.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
