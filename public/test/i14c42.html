<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Rubik's Cube with Numbers on Faces and Super Smooth Rotating Axes Labels</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #pause-button {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #pause-button:hover {
            background-color: #e0e0e0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>

<body>
    <div id="scene-container"></div>
    <button id="pause-button">暂停旋转</button>
    <script>
        // 创建场景
        const scene = new THREE.Scene();

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        const sceneContainer = document.getElementById('scene-container');
        sceneContainer.appendChild(renderer.domElement);

        // 定义每个面的颜色
        const materials = [
            new THREE.MeshBasicMaterial({ color: 0xff0000 }),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 }),
            new THREE.MeshBasicMaterial({ color: 0x0000ff }),
            new THREE.MeshBasicMaterial({ color: 0xffff00 }),
            new THREE.MeshBasicMaterial({ color: 0xff00ff }),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        ];

        // 创建几何体
        const geometry = new THREE.BoxGeometry();

        // 创建魔方
        const cubeSize = 1;
        const cubeSpacing = 0.1;
        const cubeGroup = new THREE.Group();
        const loader = new THREE.FontLoader();
        
        // 加载字体并创建魔方块和数字
        loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            // 前面（红色）：11-19
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        1 * (cubeSize + cubeSpacing),
                        y * (cubeSize + cubeSpacing),
                        z * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);

                    const number = 10 + ((y + 1) * 3 + (z + 1) + 1);
                    createText(font, number, cube.position, new THREE.Vector3(cubeSize / 2 + 0.05, 0, 0));
                }
            }
            // 右面（绿色）：21-29
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        x * (cubeSize + cubeSpacing),
                        1 * (cubeSize + cubeSpacing),
                        z * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);

                    const number = 20 + ((x + 1) * 3 + (z + 1) + 1);
                    const textGeometry = new THREE.TextGeometry(number.toString(), {
                        font: font,
                        size: 0.2,
                        height: 0.01
                    });
                    const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                    textMesh.position.copy(cube.position);
                    textMesh.position.add(new THREE.Vector3(0, cubeSize / 2 + 0.05, 0));
                    cubeGroup.add(textMesh);
                }
            }
            // 顶部（蓝色）：31-39
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        x * (cubeSize + cubeSpacing),
                        y * (cubeSize + cubeSpacing),
                        1 * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);

                    const number = 30 + ((x + 1) * 3 + (y + 1) + 1);
                    const textGeometry = new THREE.TextGeometry(number.toString(), {
                        font: font,
                        size: 0.2,
                        height: 0.01
                    });
                    const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                    textMesh.position.copy(cube.position);
                    textMesh.position.add(new THREE.Vector3(0, 0, cubeSize / 2 + 0.05));
                    cubeGroup.add(textMesh);
                }
            }
            // 底部（黄色）：41-49
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        x * (cubeSize + cubeSpacing),
                        y * (cubeSize + cubeSpacing),
                        -1 * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);

                    const number = 40 + ((x + 1) * 3 + (y + 1) + 1);
                    const textGeometry = new THREE.TextGeometry(number.toString(), {
                        font: font,
                        size: 0.2,
                        height: 0.01
                    });
                    const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                    textMesh.position.copy(cube.position);
                    textMesh.position.add(new THREE.Vector3(0, 0, -(cubeSize / 2 + 0.05)));
                    cubeGroup.add(textMesh);
                }
            }
            // 左面（紫色）：51-59
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        x * (cubeSize + cubeSpacing),
                        -1 * (cubeSize + cubeSpacing),
                        z * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);

                    const number = 50 + ((x + 1) * 3 + (z + 1) + 1);
                    const textGeometry = new THREE.TextGeometry(number.toString(), {
                        font: font,
                        size: 0.2,
                        height: 0.01
                    });
                    const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                    textMesh.position.copy(cube.position);
                    textMesh.position.add(new THREE.Vector3(0, -(cubeSize / 2 + 0.05), 0));
                    cubeGroup.add(textMesh);
                }
            }

            // 后面（青色）：61-69
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        -1 * (cubeSize + cubeSpacing),
                        y * (cubeSize + cubeSpacing),
                        z * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);

                    const number = 60 + ((y + 1) * 3 + (z + 1) + 1);
                    const textGeometry = new THREE.TextGeometry(number.toString(), {
                        font: font,
                        size: 0.2,
                        height: 0.01
                    });
                    const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                    textMesh.position.copy(cube.position);
                    textMesh.position.add(new THREE.Vector3(-(cubeSize / 2 + 0.05), 0, 0));
                    cubeGroup.add(textMesh);
                }
            }

            // more... 其他面的创建代码保持不变...
        });

        // 添加坐标轴
        const axesHelper = new THREE.AxesHelper(5);
        cubeGroup.add(axesHelper);

        // 创建轴标签
        loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            ['X', 'Y', 'Z'].forEach((label, index) => {
                const textGeometry = new THREE.TextGeometry(label, {
                    font: font,
                    size: 0.5,
                    height: 0.1
                });
                const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                textMesh.position.set(5 * (index === 0 ? 1 : 0), 5 * (index === 1 ? 1 : 0), 5 * (index === 2 ? 1 : 0));
                cubeGroup.add(textMesh);
            });
        });

        scene.add(cubeGroup);

        // 鼠标控制变量
        let isMouseDown = false;
        let mouseX = 0;
        let mouseY = 0;

        // 鼠标事件处理
        sceneContainer.addEventListener('mousedown', (e) => {
            if (!isPaused) return;
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        sceneContainer.addEventListener('mousemove', (e) => {
            if (!isMouseDown || !isPaused) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            mouseX = e.clientX;
            mouseY = e.clientY;
            cubeGroup.rotation.y += deltaX * 0.005;
            cubeGroup.rotation.x += deltaY * 0.005;
        });

        sceneContainer.addEventListener('mouseup', () => isMouseDown = false);

        // 动画控制
        let tween = createNewTween();
        let isPaused = false;
        
        function createNewTween() {
            return new TWEEN.Tween(cubeGroup.rotation)
                .to({ 
                    x: cubeGroup.rotation.x + Math.PI*2,
                    y: cubeGroup.rotation.y + Math.PI*2 
                }, 8000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onComplete(() => tween = createNewTween())
                .start();
        }

        document.getElementById('pause-button').addEventListener('click', () => {
            isPaused = !isPaused;
            isPaused ? tween.stop() : tween.start();
            this.textContent = isPaused ? '继续旋转' : '暂停旋转';
        });

        // 渲染循环
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整处理
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 创建文本的通用函数
        function createText(font, number, position, offset) {
            const textGeometry = new THREE.TextGeometry(number.toString(), {
                font: font,
                size: 0.2,
                height: 0.01
            });
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.copy(position).add(offset);
            cubeGroup.add(textMesh);
        }
    </script>
</body>
</html>
