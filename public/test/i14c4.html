<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Rubik's Cube with Numbers on Faces and Super Smooth Rotating Axes Labels</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>

<body>
    <div id="scene-container"></div>
    <script>
        // 创建场景
        const scene = new THREE.Scene();

        // 创建相机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        const sceneContainer = document.getElementById('scene-container');
        sceneContainer.appendChild(renderer.domElement);

        // 定义每个面的颜色
        const materials = [
            new THREE.MeshBasicMaterial({ color: 0xff0000 }), // 红色
            new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // 绿色
            new THREE.MeshBasicMaterial({ color: 0x0000ff }), // 蓝色
            new THREE.MeshBasicMaterial({ color: 0xffff00 }), // 黄色
            new THREE.MeshBasicMaterial({ color: 0xff00ff }), // 紫色
            new THREE.MeshBasicMaterial({ color: 0x00ffff })  // 青色
        ];

        // 创建几何体
        const geometry = new THREE.BoxGeometry();

        // 创建魔方
        const cubeSize = 1;
        const cubeSpacing = 0.1;
        const cubeGroup = new THREE.Group();
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(
                        x * (cubeSize + cubeSpacing),
                        y * (cubeSize + cubeSpacing),
                        z * (cubeSize + cubeSpacing)
                    );
                    cubeGroup.add(cube);
                }
            }
        }

        // 添加坐标轴
        const axesHelper = new THREE.AxesHelper(5); // 5 是坐标轴的长度
        cubeGroup.add(axesHelper);

        // 创建用于绘制文本的材质和字体加载器
        const loader = new THREE.FontLoader();
        loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            // 轴标签
            const axisLabels = ['X', 'Y', 'Z'];
            const axisPositions = [
                new THREE.Vector3(5, 0, 0),
                new THREE.Vector3(0, 5, 0),
                new THREE.Vector3(0, 0, 5)
            ];

            axisLabels.forEach((label, index) => {
                const textGeometry = new THREE.TextGeometry(label, {
                    font: font,
                    size: 0.5,
                    height: 0.1
                });
                const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                textMesh.position.copy(axisPositions[index]);
                cubeGroup.add(textMesh);
            });
        });

        scene.add(cubeGroup);

        // 定义旋转目标
        const targetRotation = {
            x: 2 * Math.PI,
            y: 2 * Math.PI,
            z: 0
        };

        // 创建 Tween 动画
        const tween = new TWEEN.Tween(cubeGroup.rotation)
           .to(targetRotation, 8000) // 增加动画时间到 8000 毫秒，让旋转更慢更平滑
           .easing(TWEEN.Easing.Cubic.InOut) // 更换缓动函数为 Cubic.InOut
           .repeat(Infinity)
           .start();

        // 渲染循环
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time); // 传入时间参数，确保 Tween 精确更新

            renderer.render(scene, camera);
        }

        animate();

        // 处理窗口大小变化
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
