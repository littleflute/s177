<!DOCTYPE html>
<html>
<head>
    <title>OOP Rubik's Cube</title>
    <style>body { margin: 0; }</style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
class Cubelet {
    constructor(x, y, z) {
        this.position = new THREE.Vector3(x, y, z);
        this.mesh = this.createMesh(x, y, z);
        this.targetRotation = new THREE.Euler();
    }

    createMesh(x, y, z) {
        const materials = Cubelet.COLORS.map((color, i) => 
            new THREE.MeshPhongMaterial({
                color: this.shouldPaintFace(x, y, z, i) ? color : 0x222222,
                shininess: 100
            })
        );
        
        const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.95, 0.95, 0.95),
            materials
        );
        mesh.position.copy(this.position);
        return mesh;
    }

    shouldPaintFace(x, y, z, faceIndex) {
        const positions = {
            0: x === 1,   // Right
            1: x === -1,  // Left
            2: y === 1,   // Up
            3: y === -1,  // Down
            4: z === 1,   // Front
            5: z === -1   // Back
        };
        return positions[faceIndex];
    }

    update(delta) {
        this.mesh.rotation.x += (this.targetRotation.x - this.mesh.rotation.x) * 0.1;
        this.mesh.rotation.y += (this.targetRotation.y - this.mesh.rotation.y) * 0.1;
    }
}

Cubelet.COLORS = [
    new THREE.Color('red'),    // Right
    new THREE.Color('orange'), // Left
    new THREE.Color('white'),  // Up
    new THREE.Color('yellow'), // Down
    new THREE.Color('green'),  // Front
    new THREE.Color('blue')    // Back
];

class RubiksCube {
    constructor() {
        this.cubelets = [];
        this.rotationQueue = [];
        this.isRotating = false;
        this.initCube();
    }

    initCube() {
        for(let x = -1; x <= 1; x++) {
            for(let y = -1; y <= 1; y++) {
                for(let z = -1; z <= 1; z++) {
                    const cubelet = new Cubelet(x, y, z);
                    this.cubelets.push(cubelet);
                }
            }
        }
    }

    rotateLayer(axis, position, direction) {
        this.rotationQueue.push({ axis, position, direction });
        if (!this.isRotating) this.processRotationQueue();
    }

    processRotationQueue() {
        if (this.rotationQueue.length === 0) return;
        
        const { axis, position, direction } = this.rotationQueue.shift();
        this.isRotating = true;
        
        const targetCubes = this.cubelets.filter(cube => 
            cube.position[axis] === position
        );

        const startTime = Date.now();
        const animate = () => {
            const progress = (Date.now() - startTime) / 300;
            const angle = Math.PI/2 * direction * Math.min(progress, 1);
            
            targetCubes.forEach(cube => {
                cube.mesh.rotation[axis] = angle;
            });
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                this.updatePositions(axis, position, direction);
                this.isRotating = false;
                this.processRotationQueue();
            }
        };
        
        animate();
    }

    updatePositions(axis, position, direction) {
        this.cubelets.forEach(cube => {
            if (cube.position[axis] !== position) return;
            
            let x = cube.position.x;
            let y = cube.position.y;
            let z = cube.position.z;
            
            switch(axis) {
                case 'x':
                    [y, z] = [-z*direction, y*direction];
                    break;
                case 'y':
                    [x, z] = [z*direction, -x*direction];
                    break;
                case 'z':
                    [x, y] = [-y*direction, x*direction];
                    break;
            }
            
            cube.position.set(x, y, z);
            cube.mesh.position.copy(cube.position);
            cube.mesh.rotation[axis] = 0;
        });
    }
}

class CameraController {
    constructor(camera, renderer) {
        this.camera = camera;
        this.renderer = renderer;
        this.targetRotation = { x: 0, y: 0 };
        this.initControls();
    }

    initControls() {
        this.mouseDown = false;
        this.startX = 0;
        this.startY = 0;
        
        this.renderer.domElement.addEventListener('mousedown', this.onMouseDown);
        this.renderer.domElement.addEventListener('mousemove', this.onMouseMove);
        this.renderer.domElement.addEventListener('mouseup', this.onMouseUp);
        document.addEventListener('keydown', this.onKeyDown);
    }

    onMouseDown = (e) => {
        this.mouseDown = true;
        this.startX = e.clientX;
        this.startY = e.clientY;
    }

    onMouseMove = (e) => {
        if (!this.mouseDown) return;
        
        this.targetRotation.y += (e.clientX - this.startX) * 0.005;
        this.targetRotation.x += (e.clientY - this.startY) * 0.005;
        
        this.startX = e.clientX;
        this.startY = e.clientY;
    }

    onMouseUp = () => {
        this.mouseDown = false;
    }

    onKeyDown = (e) => {
        const key = e.key.toLowerCase();
        const moves = {
            'u': () => rubiksCube.rotateLayer('y', 1, 1),
            'd': () => rubiksCube.rotateLayer('y', -1, 1),
            'l': () => rubiksCube.rotateLayer('x', -1, 1),
            'r': () => rubiksCube.rotateLayer('x', 1, 1),
            'f': () => rubiksCube.rotateLayer('z', 1, 1),
            'b': () => rubiksCube.rotateLayer('z', -1, 1)
        };
        
        if (moves[key]) moves[key]();
    }

    update() {
        this.camera.position.x += (5 * Math.sin(this.targetRotation.y) - this.camera.position.x) * 0.1;
        this.camera.position.z += (5 * Math.cos(this.targetRotation.y) - this.camera.position.z) * 0.1;
        this.camera.lookAt(0, 0, 0);
    }
}

// code11: 把主程序封装成一个类
let scene, renderer, rubiksCube, cameraController;

function init() {
    scene = new THREE.Scene();
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 灯光
    const ambient = new THREE.AmbientLight(0x404040);
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(ambient, light);

    // 创建魔方
    rubiksCube = new RubiksCube();
    rubiksCube.cubelets.forEach(cube => scene.add(cube.mesh));

    // 相机控制
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/innerHeight, 0.1, 1000);
    camera.position.z = 6;
    cameraController = new CameraController(camera, renderer);

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    rubiksCube.cubelets.forEach(cube => cube.update());
    cameraController.update();
    renderer.render(scene, cameraController.camera);
}

// 启动
init();
    </script>
</body>
</html>
